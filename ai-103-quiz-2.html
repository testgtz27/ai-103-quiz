<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AI-103 Quiz 2 (30 câu)</title>
<style>
:root{
  --green:#1e8e3e; --green-bg:#e6f4ea;
  --red:#d93025; --red-bg:#fce8e6;
  --blue:#1a73e8; --gray:#5f6368; --border:#dadce0;
}
*{box-sizing:border-box;}
body{
  font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  background:#f6f7f9; margin:0; padding:0; color:#202124;
}
.wrap{max-width:760px; margin:0 auto; padding:20px 16px 60px;}
header{position:sticky; top:0; background:#fff; border-bottom:1px solid var(--border); padding:12px 16px; z-index:5;}
header .top{display:flex; justify-content:space-between; align-items:center; max-width:760px; margin:0 auto;}
header h1{font-size:16px; margin:0;}
.progress-bar{height:6px; background:#eee; border-radius:4px; margin-top:8px; overflow:hidden;}
.progress-fill{height:100%; background:var(--blue); width:0%; transition:width .2s;}
.score{font-size:13px; color:var(--gray);}
.card{background:#fff; border:1px solid var(--border); border-radius:10px; padding:20px; margin-top:18px;}
.qnum{font-size:12px; color:var(--blue); font-weight:600; text-transform:uppercase; letter-spacing:.5px;}
.qtext{font-size:17px; font-weight:600; margin:8px 0 14px; line-height:1.4;}
.hint{font-size:13px; color:var(--gray); margin-bottom:10px;}
.option{
  display:flex; align-items:flex-start; gap:10px;
  border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:8px;
  cursor:pointer; transition:background .15s, border-color .15s;
}
.option:hover{background:#f1f4fd;}
.option .mark{
  flex:0 0 20px; height:20px; border:2px solid #bbb; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; margin-top:2px;
}
.option.multi .mark{border-radius:4px;}
.option.selected .mark{background:var(--blue); border-color:var(--blue);}
.option.correct{background:var(--green-bg); border-color:var(--green);}
.option.correct .mark{background:var(--green); border-color:var(--green);}
.option.incorrect{background:var(--red-bg); border-color:var(--red);}
.option.incorrect .mark{background:var(--red); border-color:var(--red);}
.option .label{font-size:15px; line-height:1.4;}
.statement{border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:10px;}
.statement .stext{font-size:15px; margin-bottom:10px;}
.tfbtns{display:flex; gap:8px;}
.tfbtn{flex:1; padding:8px 0; text-align:center; border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:14px; font-weight:600; color:var(--gray);}
.tfbtn:hover{background:#f1f4fd;}
.tfbtn.selected{border-color:var(--blue); color:var(--blue); background:#eaf1fe;}
.tfbtn.correct{background:var(--green-bg); border-color:var(--green); color:var(--green);}
.tfbtn.incorrect{background:var(--red-bg); border-color:var(--red); color:var(--red);}
.matchrow{display:flex; justify-content:space-between; align-items:center; gap:10px; border:1px solid var(--border); border-radius:8px; padding:10px 14px; margin-bottom:8px;}
.matchrow .desc{font-size:14px; flex:1;}
select{
  font-size:14px; padding:6px 8px; border-radius:6px; border:1px solid var(--border); background:#fff; min-width:180px;
}
.matchrow.correct{background:var(--green-bg); border-color:var(--green);}
.matchrow.incorrect{background:var(--red-bg); border-color:var(--red);}
.orderitem{display:flex; align-items:center; gap:12px; border:1px solid var(--border); border-radius:8px; padding:10px 14px; margin-bottom:8px;}
.orderitem .otext{flex:1; font-size:14px;}
.orderitem.correct{background:var(--green-bg); border-color:var(--green);}
.orderitem.incorrect{background:var(--red-bg); border-color:var(--red);}
.fillrow{margin-bottom:12px; font-size:15px; line-height:1.6;}
.fillrow select{margin:0 4px;}
.fillrow.correct select{background:var(--green-bg); border-color:var(--green);}
.fillrow.incorrect select{background:var(--red-bg); border-color:var(--red);}
.actions{display:flex; gap:10px; margin-top:18px;}
button.act{
  flex:1; padding:12px 0; border-radius:8px; border:none; font-size:15px; font-weight:600; cursor:pointer;
}
.btn-check{background:var(--blue); color:#fff;}
.btn-check:disabled{background:#c7d4f5; cursor:not-allowed;}
.btn-next{background:#202124; color:#fff;}
.explain{
  margin-top:16px; padding:14px 16px; border-radius:8px; background:#fff8e1; border:1px solid #f2d675;
  font-size:14px; line-height:1.55; display:none;
}
.explain.show{display:block;}
.explain b{color:#8a6d00;}
.result-badge{display:inline-block; padding:2px 10px; border-radius:12px; font-size:12px; font-weight:700; margin-bottom:8px;}
.result-badge.ok{background:var(--green-bg); color:var(--green);}
.result-badge.no{background:var(--red-bg); color:var(--red);}
.navrow{display:flex; justify-content:space-between; margin-top:14px;}
.navrow button{background:none; border:none; color:var(--blue); font-size:14px; cursor:pointer; padding:6px 4px;}
.navrow button:disabled{color:#ccc; cursor:not-allowed;}
.finalscreen{text-align:center; padding:40px 20px;}
.finalscreen h2{font-size:24px;}
.finalscreen .big{font-size:48px; font-weight:800; color:var(--blue); margin:10px 0;}
.jumpgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px;}
.jumpgrid button{aspect-ratio:1; border-radius:6px; border:1px solid var(--border); background:#fff; font-size:13px; cursor:pointer;}
.jumpgrid button.done-ok{background:var(--green-bg); border-color:var(--green); color:var(--green);}
.jumpgrid button.done-no{background:var(--red-bg); border-color:var(--red); color:var(--red);}
.jumpgrid button.current{outline:2px solid var(--blue);}

.hamburger{
  background:none; border:1px solid var(--border); border-radius:8px; width:36px; height:36px;
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto;
}
.hamburger span{display:block; width:16px; height:2px; background:#202124; position:relative;}
.hamburger span::before, .hamburger span::after{content:''; position:absolute; left:0; width:16px; height:2px; background:#202124;}
.hamburger span::before{top:-5px;} .hamburger span::after{top:5px;}

.sidebar-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30; display:none;
}
.sidebar-overlay.open{display:block;}
.sidebar{
  position:fixed; top:0; right:-300px; width:280px; max-width:82vw; height:100%;
  background:#fff; z-index:40; box-shadow:-2px 0 12px rgba(0,0,0,.15);
  transition:right .25s ease; overflow-y:auto; padding:16px;
}
.sidebar.open{right:0;}
.sidebar-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.sidebar-header h2{font-size:15px; margin:0;}
.sidebar-close{background:none; border:none; font-size:22px; line-height:1; cursor:pointer; color:var(--gray); padding:0 4px;}
.sidebar-legend{display:flex; gap:12px; font-size:11px; color:var(--gray); margin-bottom:12px; flex-wrap:wrap;}
.sidebar-legend span{display:inline-flex; align-items:center; gap:4px;}
.legend-dot{width:10px; height:10px; border-radius:3px; display:inline-block;}
.legend-dot.ok{background:var(--green-bg); border:1px solid var(--green);}
.legend-dot.no{background:var(--red-bg); border:1px solid var(--red);}
.legend-dot.none{background:#fff; border:1px solid var(--border);}

@media (max-width:480px){
  .wrap{padding:14px 12px 40px;}
  .card{padding:16px 14px;}
  .qtext{font-size:16px;}
  .option{padding:11px 12px;}
  .option .label{font-size:14px;}
  .actions{flex-direction:column;}
  header h1{font-size:15px;}
  .score{font-size:12px;}
}
.btn-copy{background:#fff; color:var(--blue); border:1px solid var(--blue);}
.btn-copy:hover{background:#eaf1fe;}
.copy-toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:#202124; color:#fff; padding:10px 18px; border-radius:20px; font-size:13px;
  opacity:0; transition:opacity .25s; pointer-events:none; z-index:50;
}
.copy-toast.show{opacity:1;}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>AI-103 · Quiz 2</h1>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="score" id="scoreLabel">0 / 30 đúng</div>
      <button class="hamburger" onclick="openSidebar()" aria-label="Danh sách câu hỏi"><span></span></button>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</header>

<div class="wrap">
  <div id="quizArea"></div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>Danh sách câu hỏi</h2>
    <button class="sidebar-close" onclick="closeSidebar()">&times;</button>
  </div>
  <div class="sidebar-legend">
    <span><span class="legend-dot ok"></span>Đúng</span>
    <span><span class="legend-dot no"></span>Sai</span>
    <span><span class="legend-dot none"></span>Chưa làm</span>
  </div>
  <div class="jumpgrid" id="jumpGrid"></div>
</div>

<div class="copy-toast" id="copyToast">Đã copy prompt vào clipboard ✓</div>

<script>
/* =========================================================
   AI-103 Quiz 2
   Biên soạn lại theo các chủ đề/khái niệm thường gặp trong đề thi
   AI-103 (không sao chép nguyên văn từ nguồn bên thứ ba).
   type: single | multi | tf | match | order | fill
   ========================================================= */
const quizData = [
{id:1, type:"single", text:"A customer support agent must reason deeply over long, multi-step conversations and generate detailed natural-language explanations. Which model type best fits this requirement?",
 options:["A multimodal model that also processes images and audio","A small language model (SLM) optimized for low latency","A key-phrase extraction model","A large language model (LLM)"],
 correct:3,
 explain:"LLM phù hợp nhất cho việc reasoning nhiều bước và tạo văn bản giải thích chi tiết. SLM đánh đổi khả năng reasoning sâu để lấy tốc độ/chi phí thấp hơn — không phù hợp khi cần suy luận phức tạp. Multimodal model thêm khả năng xử lý ảnh/âm thanh nhưng không cần thiết ở đây. Key-phrase extraction chỉ là tác vụ NLP hẹp, không phải model sinh văn bản reasoning."},

{id:2, type:"single", text:"An agent needs to answer complex questions that require breaking the question into multiple sub-queries, using conversation history to guide retrieval, and running sub-queries in parallel to reduce latency. Which retrieval approach fits best?",
 options:["Sequential iterative retrieval that retrieves one chunk at a time","Chain-of-thought prompting without any retrieval step","Agentic RAG that decomposes and parallelizes retrieval","Classic single-shot RAG"],
 correct:2,
 explain:"Agentic RAG chia nhỏ câu hỏi phức tạp thành nhiều sub-query, dùng lịch sử hội thoại để định hướng truy vấn, và có thể chạy song song để giảm độ trễ — khớp với cả 3 yêu cầu. Classic RAG chỉ truy xuất một lần (single-shot), không chia nhỏ. Iterative retrieval là tuần tự, không song song. Chain-of-thought là kỹ thuật prompting, không phải phương pháp truy xuất dữ liệu.",},

{id:3, type:"single", text:"A retail company wants its support agent to answer questions only about the company's own products, using PDF catalogs stored privately in Azure Blob Storage. The agent must retrieve relevant passages using semantic and vector search. Which service should be used as the retrieval layer?",
 options:["Azure Translator in Foundry Tools","Grounding with Bing Search","Azure AI Search","Azure AI Document Intelligence"],
 correct:2,
 explain:"Azure AI Search cung cấp index có semantic/vector search để agent truy xuất nội dung riêng tư (PDF nội bộ). Bing Search grounding chỉ tìm trên internet công khai, không index tài liệu riêng. Translator chỉ dịch ngôn ngữ. Document Intelligence trích xuất nội dung từ tài liệu nhưng không phải lớp truy xuất/index cho RAG."},

{id:4, type:"single", text:"A team is indexing PDFs that contain embedded images. They want the built-in OCR skill in an Azure AI Search skillset to process text inside those images. Which indexing approach correctly feeds images into the OCR skill?",
 options:["Use an indexer to extract image data into a normalized_images collection","Use a Shaper skill to restructure the OCR input","Run the OCR skill directly against the raw content field of the index","Use outputFieldMappings to write image data to a searchable field"],
 correct:0,
 explain:"OCR skill có sẵn của Azure AI Search cần input là normalized_images collection, được tạo ra khi indexer trích xuất ảnh nhúng trong tài liệu. Shaper skill chỉ tái cấu trúc dữ liệu, không trích ảnh. Chạy OCR trực tiếp trên content field sẽ không hoạt động vì đó là text, không phải ảnh. outputFieldMappings dùng để ghi kết quả ra field cuối, không phải bước trích ảnh đầu vào."},

{id:5, type:"single", text:"A responsible AI reviewer wants an agent to automatically detect and mask any personal information (names, phone numbers, emails) appearing in generated responses before they reach the end user. Which safeguard should be configured?",
 options:["A content safety filter for violence and hate speech only","PII detection and redaction on model output","A rate limit on requests per minute","A larger context window for the model"],
 correct:1,
 explain:"PII detection và redaction được thiết kế riêng để phát hiện và ẩn thông tin cá nhân trong output. Content safety filter cho violence/hate không xử lý PII. Rate limit và context window không liên quan tới việc bảo vệ dữ liệu cá nhân."},

{id:6, type:"single", text:"A team wants to give a Microsoft Foundry agent access to internal ticketing data. They want the agent to discover and call available operations from a remote service dynamically, without hardcoding every function signature in the agent's code. Which mechanism fits best?",
 options:["Model Context Protocol (MCP) tool integration","A fixed system prompt describing every operation in text","A single hardcoded function tool per operation","Increasing the model's temperature setting"],
 correct:0,
 explain:"MCP cho phép agent khám phá và gọi tool từ một server từ xa một cách linh hoạt tại runtime, không cần viết cứng từng function. Mô tả trong system prompt không đảm bảo agent gọi đúng API thực tế. Hardcode từng function tool đi ngược lại yêu cầu 'không cần viết cứng'. Temperature không liên quan tới việc tích hợp tool."},

{id:7, type:"single", text:"An architect is designing a multi-agent pipeline where a triage agent must send each request to exactly one of several specialist agents based on the request's classification. Which orchestration pattern fits best?",
 options:["Sequential orchestration where every agent always runs in a fixed order","Handoff orchestration with routing based on classification","Concurrent orchestration where all agents run in parallel regardless of topic","Running all agents on every request and picking the longest response"],
 correct:1,
 explain:"Handoff orchestration cho phép chuyển yêu cầu tới đúng agent chuyên biệt dựa trên phân loại/context — đúng với yêu cầu 'gửi tới đúng 1 agent'. Sequential orchestration luôn chạy agent theo thứ tự cố định bất kể nội dung. Concurrent chạy song song tất cả, lãng phí tài nguyên khi chỉ cần một agent xử lý. Chạy tất cả rồi chọn response dài nhất không phải là logic routing hợp lý."},

{id:8, type:"single", text:"A team is choosing between fine-tuning a model and using retrieval augmented generation (RAG) for a support assistant that needs up-to-date product prices that change daily. Which approach is more appropriate and why?",
 options:["Fine-tuning, because it permanently embeds facts into model weights","RAG, because it injects current knowledge at inference time without retraining","Fine-tuning, because it is cheaper to update than a search index","Neither approach can handle frequently changing information"],
 correct:1,
 explain:"RAG lấy dữ liệu mới nhất tại thời điểm truy vấn (runtime), phù hợp với dữ liệu thay đổi hàng ngày như giá sản phẩm. Fine-tuning yêu cầu train lại mỗi khi dữ liệu đổi — tốn kém và chậm hơn nhiều so với cập nhật index. Cả hai phương pháp đều xử lý được thông tin động, nhưng RAG hiệu quả hơn nhiều trong trường hợp này."},

{id:9, type:"multi", text:"A team is setting up a Content Understanding analyzer to process scanned troubleshooting guides with two-column layouts and tables. Which capabilities should they rely on to correctly extract structured field values?", note:"Chọn 2 đáp án",
 options:["A field schema that defines the fields to extract from the document","A layout-aware analyzer that understands tables and multi-column pages","Deleting all table structures before indexing so text stays linear","Ignoring page layout information entirely and processing raw OCR text only"],
 correct:[0,1],
 explain:"Field schema định nghĩa cụ thể field cần trích xuất, còn layout-aware analyzer hiểu được bảng biểu/nhiều cột để không làm lẫn lộn thứ tự đọc. Xoá cấu trúc bảng hoặc bỏ qua layout sẽ làm mất thông tin quan trọng và gây sai lệch khi trích xuất từ tài liệu phức tạp."},

{id:10, type:"single", text:"An organization must ensure an agent's tool-calling behavior requires human approval before any action that modifies external data (e.g., creating a ticket). Which configuration addresses this requirement?",
 options:["Disable all function tools for the agent","Configure an approval mode that requires confirmation before tool execution","Increase the agent's temperature so it asks more questions","Remove the agent's access to conversation history"],
 correct:1,
 explain:"Approval mode cho tool cho phép yêu cầu xác nhận của con người trước khi thực thi hành động có tác động (như tạo ticket) — đúng yêu cầu. Tắt hết tool sẽ làm agent mất khả năng hành động hoàn toàn, không phải giải pháp mong muốn. Temperature và conversation history không liên quan tới việc kiểm soát quyền thực thi tool."},

{id:11, type:"single", text:"A team wants to reduce the risk of an agent 'hallucinating' facts by ensuring every claim in its response is backed by a retrieved source document, and users can click through to that source. What best supports this requirement?",
 options:["Increasing the model's max output tokens","Grounding responses in retrieved content with citations back to source documents","Lowering the temperature to zero only","Switching to a smaller, faster model"],
 correct:1,
 explain:"Grounding kết hợp với citation đảm bảo mỗi câu trả lời được neo vào tài liệu nguồn cụ thể mà người dùng có thể kiểm tra lại — trực tiếp giảm hallucination và tăng độ tin cậy. Tăng max tokens, giảm temperature về 0, hay đổi sang model nhỏ hơn không đảm bảo tính đúng đắn hay khả năng truy vết nguồn."},

{id:12, type:"single", text:"A developer needs a single Azure resource that provides the broadest feature availability and tightest integration when building solutions that use the Voice Live API. Which resource type should they choose?",
 options:["A generic Cognitive Services multi-service resource created outside Foundry","A Microsoft Foundry resource","A storage account configured for audio files","An Azure Kubernetes Service cluster"],
 correct:1,
 explain:"Microsoft Foundry resource được khuyến nghị vì cung cấp đầy đủ tính năng và tích hợp tốt nhất với hệ sinh thái Foundry cho các workload dùng Voice Live API. Storage account hay AKS cluster không phải là resource cung cấp API này; multi-service resource ngoài Foundry không có mức tích hợp tương đương."},

{id:13, type:"single", text:"A solution must classify incoming support tickets into categories and then route each ticket to a different specialist agent using a switch-style pattern, without duplicating the same conditional logic for every possible category. What design technique best supports this?",
 options:["Hardcode a separate if/else branch manually for every category","Use factory functions that generate a condition checker per category value","Run every specialist agent on every ticket and keep only the first response","Store the category as free text and let the model guess the route each time"],
 correct:1,
 explain:"Factory function tạo ra logic điều kiện có thể tái sử dụng cho từng giá trị phân loại, tránh viết lặp lại code branching. Viết tay từng nhánh if/else cho mỗi category sẽ khó bảo trì khi số category tăng lên. Chạy tất cả agent rồi chỉ giữ response đầu tiên lãng phí tài nguyên. Để model tự đoán route mỗi lần thiếu kiểm soát và không đáng tin cậy."},

{id:14, type:"single", text:"A team needs to generate a short promotional video clip directly from a written creative brief, without filming any footage. Which Azure AI capability fits this need?",
 options:["Object detection on existing video footage","Video generation from text prompts","Speech-to-text transcription of an existing video's audio track","Image classification of video thumbnails"],
 correct:1,
 explain:"Video generation model tạo video mới hoàn toàn từ prompt văn bản, đúng yêu cầu không cần quay phim thật. Object detection và image classification chỉ phân tích nội dung có sẵn, không tạo mới. Speech-to-text chỉ chuyển âm thanh có sẵn thành văn bản."},

{id:15, type:"single", text:"An application submits a request to an asynchronous Content Understanding analyzer and receives an operation ID with status 'running'. What should the application do to obtain the final result?",
 options:["Immediately assume the operation failed and retry from scratch","Poll the operation status endpoint using the operation ID until it completes","Resubmit the same original request repeatedly with new content","Delete the analyzer and create a new one to force completion"],
 correct:1,
 explain:"Với thao tác bất đồng bộ, ứng dụng cần poll (kiểm tra định kỳ) trạng thái bằng operation ID cho tới khi hoàn tất, thay vì coi là lỗi ngay, gửi lại request gốc, hay xoá/tạo lại analyzer."},

{id:16, type:"single", text:"A healthcare provider wants to detect the language of incoming patient messages that could arrive in any of several languages, before routing each message to the right language-specific workflow. Which Azure AI Language capability fits this need?",
 options:["Key phrase extraction","Language detection","Text summarization","Entity linking"],
 correct:1,
 explain:"Language detection xác định ngôn ngữ của văn bản đầu vào, cho phép định tuyến tới workflow phù hợp. Key phrase extraction, summarization, và entity linking là các tác vụ NLP khác, không xác định ngôn ngữ."},

{id:17, type:"single", text:"A team building a customer-facing voice assistant wants specific product names to be pronounced correctly and wants to control pitch and speaking rate for a more natural voice. Which technology should they use to control this?",
 options:["A JSON configuration file sent as the chat message role","SSML markup applied to the speech synthesis request","A higher temperature setting on the underlying model","A larger max_tokens value in the completion request"],
 correct:1,

/* =========================================================
   STATE & RENDER LOGIC
   ========================================================= */
let current = 0;
let answered = new Array(quizData.length).fill(null); // null | true | false (correct?)
let userSel = new Array(quizData.length).fill(null);

const quizArea = document.getElementById('quizArea');
const scoreLabel = document.getElementById('scoreLabel');
const progressFill = document.getElementById('progressFill');
const jumpGrid = document.getElementById('jumpGrid');

function buildJumpGrid(){
  jumpGrid.innerHTML = '';
  quizData.forEach((q,i)=>{
    const b = document.createElement('button');
    b.textContent = i+1;
    b.onclick = ()=>{ current = i; render(); closeSidebar(); };
    jumpGrid.appendChild(b);
  });
}

function updateHeader(){
  const answeredCount = answered.filter(a=>a!==null).length;
  const correctCount = answered.filter(a=>a===true).length;
  scoreLabel.textContent = correctCount + ' / ' + quizData.length + ' đúng (' + answeredCount + ' đã làm)';
  progressFill.style.width = (answeredCount/quizData.length*100) + '%';
  Array.from(jumpGrid.children).forEach((b,i)=>{
    b.classList.remove('done-ok','done-no','current');
    if(answered[i]===true) b.classList.add('done-ok');
    else if(answered[i]===false) b.classList.add('done-no');
    if(i===current) b.classList.add('current');
  });
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function getDisplay(q){
  // Shuffles single/multi answer options once per question and remaps the
  // correct index/indices so the correct answer isn't always in the same spot.
  if(q._d) return q._d;
  if(q.type === 'single' || q.type === 'multi'){
    const order = shuffle(q.options.map((_,i)=>i));
    const newOptions = order.map(oi=>q.options[oi]);
    let newCorrect;
    if(q.type === 'single'){
      newCorrect = order.indexOf(q.correct);
    } else {
      newCorrect = q.correct.map(oc=>order.indexOf(oc));
    }
    q._d = {options:newOptions, correct:newCorrect};
  } else {
    q._d = {options:q.options, correct:q.correct};
  }
  return q._d;
}

function formatExplain(text){
  // Xuống hàng giữa các câu/mệnh đề để dễ đọc: tách sau dấu chấm khi
  // theo sau là chữ hoa hoặc số (tránh tách nhầm viết tắt như "v.v." hay "e.g.").
  var parts = text.split(/(?<=\.)\s+(?=[A-Z0-9ÀÁẢÃẠĂẰẲẴẶẤẦẨẪẬÂÈÉẺẼẸÊỀẾỂỄỆÌÍỈĨỊÒÓỎÕỌÔỒỐỔỖỘƠỜỚỞỠỢÙÚỦŨỤƯỪỨỬỮỰỲÝỶỸỴĐ])/u);
  return parts.join('<br><br>');
}

function render(){
  const q = quizData[current];
  const isDone = answered[current] !== null;
  let html = '<div class="card">';
  html += '<div class="qnum">Câu ' + (current+1) + ' / ' + quizData.length + '</div>';
  html += '<div class="qtext">' + q.text + '</div>';
  if(q.note) html += '<div class="hint">' + q.note + '</div>';

  if(q.type === 'single' || q.type === 'multi'){
    const d = getDisplay(q);
    html += '<div id="optList">';
    d.options.forEach((opt,i)=>{
      html += '<div class="option ' + (q.type==='multi'?'multi':'') + '" data-i="'+i+'" onclick="toggleOption('+i+')"><div class="mark"></div><div class="label">'+opt+'</div></div>';
    });
    html += '</div>';
  } else if(q.type === 'tf'){
    html += '<div id="tfList">';
    q.statements.forEach((s,i)=>{
      html += '<div class="statement" data-i="'+i+'"><div class="stext">'+s.text+'</div><div class="tfbtns">'+
        '<div class="tfbtn" data-val="true" onclick="setTF('+i+',true)">True / Đúng</div>'+
        '<div class="tfbtn" data-val="false" onclick="setTF('+i+',false)">False / Sai</div>'+
        '</div></div>';
    });
    html += '</div>';
  } else if(q.type === 'match'){
    if(!q._poolDisplay) q._poolDisplay = shuffle(q.pool);
    html += '<div id="matchList">';
    q.rows.forEach((r,i)=>{
      html += '<div class="matchrow" data-i="'+i+'"><div class="desc">'+r.desc+'</div><select onchange="setMatch('+i+',this.value)"><option value="">-- chọn --</option>';
      q._poolDisplay.forEach(p=>{ html += '<option value="'+p+'">'+p+'</option>'; });
      html += '</select></div>';
    });
    html += '</div>';
  } else if(q.type === 'order'){
    if(!q._display) q._display = shuffle(q.correctOrder);
    html += '<div id="orderList">';
    q._display.forEach((text,i)=>{
      html += '<div class="orderitem" data-text="'+encodeURIComponent(text)+'"><select onchange="setOrder(this)"><option value="">#</option>';
      for(let n=1;n<=q.correctOrder.length;n++) html += '<option value="'+n+'">'+n+'</option>';
      html += '</select><div class="otext">'+text+'</div></div>';
    });
    html += '</div>';
  } else if(q.type === 'fill'){
    html += '<div id="fillList">';
    q.blanks.forEach((b,i)=>{
      if(!b._displayOptions) b._displayOptions = shuffle(b.options);
      html += '<div class="fillrow" data-i="'+i+'">'+ (b.prefix?b.prefix+' ':'') +
        '<select onchange="setFill('+i+',this.value)"><option value="">-- chọn --</option>';
      b._displayOptions.forEach(o=>{ html += '<option value="'+o+'">'+o+'</option>'; });
      html += '</select> ' + (b.suffix||'') + '</div>';
    });
    html += '</div>';
  }

  html += '<div class="explain" id="explainBox"><b>Giải thích:</b><br><br>' + formatExplain(q.explain) + '</div>';
  html += '<div class="actions">';
  html += '<button class="act btn-check" id="checkBtn" onclick="checkAnswer()">Kiểm tra</button>';
  html += '<button class="act btn-copy" onclick="copyPrompt()">📋 Copy prompt hỏi AI</button>';
  html += '</div>';
  html += '<div class="navrow"><button onclick="goPrev()" '+(current===0?'disabled':'')+'>&larr; Câu trước</button><button onclick="goNext()" '+(current===quizData.length-1?'disabled':'')+'>Câu sau &rarr;</button></div>';
  html += '</div>';

  quizArea.innerHTML = html;

  // restore state if already answered
  if(isDone){
    restoreState(q);
  }
  updateHeader();
}

function toggleOption(i){
  const q = quizData[current];
  if(answered[current] !== null) return;
  if(!userSel[current]) userSel[current] = q.type==='multi' ? new Set() : null;
  const els = document.querySelectorAll('#optList .option');
  if(q.type === 'single'){
    userSel[current] = i;
    els.forEach(e=>e.classList.remove('selected'));
    els[i].classList.add('selected');
  } else {
    if(userSel[current].has(i)) userSel[current].delete(i);
    else userSel[current].add(i);
    els[i].classList.toggle('selected');
  }
}

function setTF(i,val){
  if(answered[current] !== null) return;
  if(!userSel[current]) userSel[current] = {};
  userSel[current][i] = val;
  const stmt = document.querySelectorAll('#tfList .statement')[i];
  stmt.querySelectorAll('.tfbtn').forEach(b=>b.classList.remove('selected'));
  stmt.querySelector('.tfbtn[data-val="'+val+'"]').classList.add('selected');
}

function setMatch(i,val){
  if(!userSel[current]) userSel[current] = {};
  userSel[current][i] = val;
}

function setOrder(sel){
  if(!userSel[current]) userSel[current] = {};
  const item = sel.closest('.orderitem');
  const text = decodeURIComponent(item.getAttribute('data-text'));
  userSel[current][text] = sel.value;
}

function setFill(i,val){
  if(!userSel[current]) userSel[current] = {};
  userSel[current][i] = val;
}

function checkAnswer(){
  const q = quizData[current];
  if(answered[current] !== null) return;
  let isCorrect = false;

  if(q.type === 'single'){
    const d = getDisplay(q);
    const sel = userSel[current];
    if(sel === null || sel === undefined){ alert('Hãy chọn một đáp án.'); return; }
    isCorrect = (sel === d.correct);
    const els = document.querySelectorAll('#optList .option');
    els.forEach((e,i)=>{
      if(i === d.correct) e.classList.add('correct');
      else if(i === sel) e.classList.add('incorrect');
    });
  } else if(q.type === 'multi'){
    const d = getDisplay(q);
    const sel = userSel[current] || new Set();
    if(sel.size === 0){ alert('Hãy chọn các đáp án.'); return; }
    const correctSet = new Set(d.correct);
    isCorrect = sel.size === correctSet.size && [...sel].every(x=>correctSet.has(x));
    const els = document.querySelectorAll('#optList .option');
    els.forEach((e,i)=>{
      if(correctSet.has(i)) e.classList.add('correct');
      else if(sel.has(i)) e.classList.add('incorrect');
    });
  } else if(q.type === 'tf'){
    const sel = userSel[current] || {};
    if(Object.keys(sel).length < q.statements.length){ alert('Hãy chọn True/False cho tất cả.'); return; }
    isCorrect = true;
    const stmts = document.querySelectorAll('#tfList .statement');
    q.statements.forEach((s,i)=>{
      const userVal = sel[i];
      const ok = (userVal === s.answer);
      if(!ok) isCorrect = false;
      const btn = stmts[i].querySelector('.tfbtn[data-val="'+s.answer+'"]');
      btn.classList.add('correct');
      if(!ok){
        const wrongBtn = stmts[i].querySelector('.tfbtn[data-val="'+userVal+'"]');
        if(wrongBtn) wrongBtn.classList.add('incorrect');
      }
    });
  } else if(q.type === 'match'){
    const sel = userSel[current] || {};
    if(Object.keys(sel).length < q.rows.length){ alert('Hãy chọn cho tất cả các dòng.'); return; }
    isCorrect = true;
    const rows = document.querySelectorAll('#matchList .matchrow');
    q.rows.forEach((r,i)=>{
      const ok = sel[i] === r.correct;
      if(!ok) isCorrect = false;
      rows[i].classList.add(ok?'correct':'incorrect');
      const select = rows[i].querySelector('select');
      select.disabled = true;
      if(!ok){
        const hintSpan = document.createElement('div');
        hintSpan.style.fontSize='12px'; hintSpan.style.color='#1e8e3e'; hintSpan.style.marginTop='4px';
        hintSpan.textContent = 'Đáp án đúng: ' + r.correct;
        rows[i].appendChild(hintSpan);
      }
    });
  } else if(q.type === 'order'){
    const sel = userSel[current] || {};
    if(Object.keys(sel).length < q.correctOrder.length || Object.values(sel).some(v=>!v)){ alert('Hãy chọn số thứ tự cho tất cả.'); return; }
    isCorrect = true;
    const items = document.querySelectorAll('#orderList .orderitem');
    items.forEach(item=>{
      const text = decodeURIComponent(item.getAttribute('data-text'));
      const correctPos = q.correctOrder.indexOf(text) + 1;
      const userPos = parseInt(sel[text]);
      const ok = (userPos === correctPos);
      if(!ok) isCorrect = false;
      item.classList.add(ok?'correct':'incorrect');
      item.querySelector('select').disabled = true;
      if(!ok){
        const hintSpan = document.createElement('span');
        hintSpan.style.fontSize='12px'; hintSpan.style.color='#1e8e3e'; hintSpan.style.marginLeft='8px';
        hintSpan.textContent = '(đúng: #' + correctPos + ')';
        item.appendChild(hintSpan);
      }
    });
  } else if(q.type === 'fill'){
    const sel = userSel[current] || {};
    if(Object.keys(sel).length < q.blanks.length || Object.values(sel).some(v=>!v)){ alert('Hãy chọn cho tất cả các ô trống.'); return; }
    isCorrect = true;
    const rows = document.querySelectorAll('#fillList .fillrow');
    q.blanks.forEach((b,i)=>{
      const ok = sel[i] === b.correct;
      if(!ok) isCorrect = false;
      rows[i].classList.add(ok?'correct':'incorrect');
      rows[i].querySelector('select').disabled = true;
      if(!ok){
        const hintSpan = document.createElement('span');
        hintSpan.style.fontSize='12px'; hintSpan.style.color='#1e8e3e'; hintSpan.style.marginLeft='6px';
        hintSpan.textContent = '(đúng: ' + b.correct + ')';
        rows[i].appendChild(hintSpan);
      }
    });
  }

  answered[current] = isCorrect;
  document.getElementById('checkBtn').disabled = true;
  document.getElementById('explainBox').classList.add('show');
  const badge = document.createElement('div');
  badge.className = 'result-badge ' + (isCorrect?'ok':'no');
  badge.textContent = isCorrect ? '✔ Chính xác' : '✘ Chưa đúng';
  document.getElementById('explainBox').prepend(badge);

  updateHeader();
}

function restoreState(q){
  // disable inputs and re-apply visual state after navigating back to an answered question
  const sel = userSel[current];
  if(q.type === 'single' || q.type === 'multi'){
    const d = getDisplay(q);
    const els = document.querySelectorAll('#optList .option');
    const correctSet = new Set(Array.isArray(d.correct)?d.correct:[d.correct]);
    els.forEach((e,i)=>{
      e.onclick = null;
      const userHas = q.type==='multi' ? (sel && sel.has && sel.has(i)) : (sel===i);
      if(correctSet.has(i)) e.classList.add('correct');
      else if(userHas) e.classList.add('incorrect');
    });
  } else if(q.type === 'tf'){
    const stmts = document.querySelectorAll('#tfList .statement');
    q.statements.forEach((s,i)=>{
      stmts[i].querySelectorAll('.tfbtn').forEach(b=>b.onclick=null);
      const btn = stmts[i].querySelector('.tfbtn[data-val="'+s.answer+'"]');
      btn.classList.add('correct');
      const userVal = sel ? sel[i] : undefined;
      if(userVal !== undefined && userVal !== s.answer){
        const wrongBtn = stmts[i].querySelector('.tfbtn[data-val="'+userVal+'"]');
        if(wrongBtn) wrongBtn.classList.add('incorrect');
      }
    });
  } else if(q.type === 'match'){
    const rows = document.querySelectorAll('#matchList .matchrow');
    q.rows.forEach((r,i)=>{
      const select = rows[i].querySelector('select');
      select.disabled = true;
      if(sel && sel[i]) select.value = sel[i];
      const ok = sel && sel[i] === r.correct;
      rows[i].classList.add(ok?'correct':'incorrect');
      if(!ok){
        const hintSpan = document.createElement('div');
        hintSpan.style.fontSize='12px'; hintSpan.style.color='#1e8e3e'; hintSpan.style.marginTop='4px';
        hintSpan.textContent = 'Đáp án đúng: ' + r.correct;
        rows[i].appendChild(hintSpan);
      }
    });
  } else if(q.type === 'order'){
    const items = document.querySelectorAll('#orderList .orderitem');
    items.forEach(item=>{
      const text = decodeURIComponent(item.getAttribute('data-text'));
      const select = item.querySelector('select');
      select.disabled = true;
      if(sel && sel[text]) select.value = sel[text];
      const correctPos = q.correctOrder.indexOf(text) + 1;
      const userPos = sel ? parseInt(sel[text]) : null;
      const ok = (userPos === correctPos);
      item.classList.add(ok?'correct':'incorrect');
      if(!ok){
        const hintSpan = document.createElement('span');
        hintSpan.style.fontSize='12px'; hintSpan.style.color='#1e8e3e'; hintSpan.style.marginLeft='8px';
        hintSpan.textContent = '(đúng: #' + correctPos + ')';
        item.appendChild(hintSpan);
      }
    });
  } else if(q.type === 'fill'){
    const rows = document.querySelectorAll('#fillList .fillrow');
    q.blanks.forEach((b,i)=>{
      const select = rows[i].querySelector('select');
      select.disabled = true;
      if(sel && sel[i]) select.value = sel[i];
      const ok = sel && sel[i] === b.correct;
      rows[i].classList.add(ok?'correct':'incorrect');
      if(!ok){
        const hintSpan = document.createElement('span');
        hintSpan.style.fontSize='12px'; hintSpan.style.color='#1e8e3e'; hintSpan.style.marginLeft='6px';
        hintSpan.textContent = '(đúng: ' + b.correct + ')';
        rows[i].appendChild(hintSpan);
      }
    });
  }
  document.getElementById('checkBtn').disabled = true;
  document.getElementById('explainBox').classList.add('show');
  const badge = document.createElement('div');
  badge.className = 'result-badge ' + (answered[current]?'ok':'no');
  badge.textContent = answered[current] ? '✔ Chính xác' : '✘ Chưa đúng';
  document.getElementById('explainBox').prepend(badge);
}

function buildPromptText(q){
  let body = 'Giải thích ngắn gọn, dễ hiểu bằng tiếng Việt câu hỏi AI-103 sau — vì sao đáp án đúng là đúng và các lựa chọn khác sai ở đâu:\n\n';
  body += q.text + '\n';

  if(q.type === 'single' || q.type === 'multi'){
    const d = getDisplay(q);
    d.options.forEach((opt,i)=>{ body += String.fromCharCode(65+i) + '. ' + opt + '\n'; });
    const correctArr = Array.isArray(d.correct) ? d.correct : [d.correct];
    body += 'Đáp án đúng: ' + correctArr.map(i=>String.fromCharCode(65+i)).join(', ') + '\n';
  } else if(q.type === 'tf'){
    q.statements.forEach((s,i)=>{
      body += (i+1) + '. ' + s.text + ' → ' + (s.answer?'True':'False') + '\n';
    });
  } else if(q.type === 'match'){
    q.rows.forEach((r,i)=>{
      body += (i+1) + '. ' + r.desc + ' → ' + r.correct + '\n';
    });
  } else if(q.type === 'order'){
    q.correctOrder.forEach((s,i)=>{
      body += (i+1) + '. ' + s + '\n';
    });
  } else if(q.type === 'fill'){
    q.blanks.forEach((b,i)=>{
      body += (i+1) + '. ' + (b.prefix||'') + ' ___ ' + (b.suffix||'') + ' → ' + b.correct + '\n';
    });
  }

  return body;
}

function copyPrompt(){
  const q = quizData[current];
  const text = buildPromptText(q);
  const doToast = ()=>{
    const toast = document.getElementById('copyToast');
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'), 1800);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(doToast).catch(()=>fallbackCopy(text, doToast));
  } else {
    fallbackCopy(text, doToast);
  }
}

function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(cb) cb();
}

function goPrev(){ if(current>0){ current--; render(); } }
function goNext(){ if(current<quizData.length-1){ current++; render(); } }

function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

buildJumpGrid();
render();
