<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AI-103 Quiz 6 (50 câu)</title>
<style>
:root{
  --green:#1e8e3e; --green-bg:#e6f4ea;
  --red:#d93025; --red-bg:#fce8e6;
  --blue:#1a73e8; --gray:#5f6368; --border:#dadce0;
}
*{box-sizing:border-box;}
body{
  font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  background:#f6f7f9; margin:0; padding:0; color:#202124;
}
.wrap{max-width:760px; margin:0 auto; padding:20px 16px 60px;}
header{position:sticky; top:0; background:#fff; border-bottom:1px solid var(--border); padding:12px 16px; z-index:5;}
header .top{display:flex; justify-content:space-between; align-items:center; max-width:760px; margin:0 auto;}
header h1{font-size:16px; margin:0;}
.progress-bar{height:6px; background:#eee; border-radius:4px; margin-top:8px; overflow:hidden;}
.progress-fill{height:100%; background:var(--blue); width:0%; transition:width .2s;}
.score{font-size:13px; color:var(--gray);}
.card{background:#fff; border:1px solid var(--border); border-radius:10px; padding:20px; margin-top:18px;}
.qnum{font-size:12px; color:var(--blue); font-weight:600; text-transform:uppercase; letter-spacing:.5px;}
.qtext{font-size:17px; font-weight:600; margin:8px 0 14px; line-height:1.4;}
.hint{font-size:13px; color:var(--gray); margin-bottom:10px;}
.option{
  display:flex; align-items:flex-start; gap:10px;
  border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:8px;
  cursor:pointer; transition:background .15s, border-color .15s;
}
.option:hover{background:#f1f4fd;}
.option .mark{
  flex:0 0 20px; height:20px; border:2px solid #bbb; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; margin-top:2px;
}
.option.multi .mark{border-radius:4px;}
.option.selected .mark{background:var(--blue); border-color:var(--blue);}
.option.correct{background:var(--green-bg); border-color:var(--green);}
.option.correct .mark{background:var(--green); border-color:var(--green);}
.option.incorrect{background:var(--red-bg); border-color:var(--red);}
.option.incorrect .mark{background:var(--red); border-color:var(--red);}
.option .label{font-size:15px; line-height:1.4;}
.statement{border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:10px;}
.statement .stext{font-size:15px; margin-bottom:10px;}
.tfbtns{display:flex; gap:8px;}
.tfbtn{flex:1; padding:8px 0; text-align:center; border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:14px; font-weight:600; color:var(--gray);}
.tfbtn:hover{background:#f1f4fd;}
.tfbtn.selected{border-color:var(--blue); color:var(--blue); background:#eaf1fe;}
.tfbtn.correct{background:var(--green-bg); border-color:var(--green); color:var(--green);}
.tfbtn.incorrect{background:var(--red-bg); border-color:var(--red); color:var(--red);}
.matchrow{display:flex; justify-content:space-between; align-items:center; gap:10px; border:1px solid var(--border); border-radius:8px; padding:10px 14px; margin-bottom:8px;}
.matchrow .desc{font-size:14px; flex:1;}
select{
  font-size:14px; padding:6px 8px; border-radius:6px; border:1px solid var(--border); background:#fff; min-width:180px;
}
.matchrow.correct{background:var(--green-bg); border-color:var(--green);}
.matchrow.incorrect{background:var(--red-bg); border-color:var(--red);}
.orderitem{display:flex; align-items:center; gap:12px; border:1px solid var(--border); border-radius:8px; padding:10px 14px; margin-bottom:8px;}
.orderitem .otext{flex:1; font-size:14px;}
.orderitem.correct{background:var(--green-bg); border-color:var(--green);}
.orderitem.incorrect{background:var(--red-bg); border-color:var(--red);}
.fillrow{margin-bottom:12px; font-size:15px; line-height:1.6;}
.fillrow select{margin:0 4px;}
.fillrow.correct select{background:var(--green-bg); border-color:var(--green);}
.fillrow.incorrect select{background:var(--red-bg); border-color:var(--red);}
.actions{display:flex; gap:10px; margin-top:18px;}
button.act{
  flex:1; padding:12px 0; border-radius:8px; border:none; font-size:15px; font-weight:600; cursor:pointer;
}
.btn-check{background:var(--blue); color:#fff;}
.btn-check:disabled{background:#c7d4f5; cursor:not-allowed;}
.btn-next{background:#202124; color:#fff;}
.explain{
  margin-top:16px; padding:14px 16px; border-radius:8px; background:#fff8e1; border:1px solid #f2d675;
  font-size:14px; line-height:1.55; display:none;
}
.explain.show{display:block;}
.explain b{color:#8a6d00;}
.result-badge{display:inline-block; padding:2px 10px; border-radius:12px; font-size:12px; font-weight:700; margin-bottom:8px;}
.result-badge.ok{background:var(--green-bg); color:var(--green);}
.result-badge.no{background:var(--red-bg); color:var(--red);}
.navrow{display:flex; justify-content:space-between; margin-top:14px;}
.navrow button{background:none; border:none; color:var(--blue); font-size:14px; cursor:pointer; padding:6px 4px;}
.navrow button:disabled{color:#ccc; cursor:not-allowed;}
.finalscreen{text-align:center; padding:40px 20px;}
.finalscreen h2{font-size:24px;}
.finalscreen .big{font-size:48px; font-weight:800; color:var(--blue); margin:10px 0;}
.jumpgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px;}
.jumpgrid button{aspect-ratio:1; border-radius:6px; border:1px solid var(--border); background:#fff; font-size:13px; cursor:pointer;}
.jumpgrid button.done-ok{background:var(--green-bg); border-color:var(--green); color:var(--green);}
.jumpgrid button.done-no{background:var(--red-bg); border-color:var(--red); color:var(--red);}
.jumpgrid button.current{outline:2px solid var(--blue);}

.hamburger{
  background:none; border:1px solid var(--border); border-radius:8px; width:36px; height:36px;
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto;
}
.hamburger span{display:block; width:16px; height:2px; background:#202124; position:relative;}
.hamburger span::before, .hamburger span::after{content:''; position:absolute; left:0; width:16px; height:2px; background:#202124;}
.hamburger span::before{top:-5px;} .hamburger span::after{top:5px;}

.sidebar-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30; display:none;
}
.sidebar-overlay.open{display:block;}
.sidebar{
  position:fixed; top:0; right:-300px; width:280px; max-width:82vw; height:100%;
  background:#fff; z-index:40; box-shadow:-2px 0 12px rgba(0,0,0,.15);
  transition:right .25s ease; overflow-y:auto; padding:16px;
}
.sidebar.open{right:0;}
.sidebar-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.sidebar-header h2{font-size:15px; margin:0;}
.sidebar-close{background:none; border:none; font-size:22px; line-height:1; cursor:pointer; color:var(--gray); padding:0 4px;}
.sidebar-legend{display:flex; gap:12px; font-size:11px; color:var(--gray); margin-bottom:12px; flex-wrap:wrap;}
.sidebar-legend span{display:inline-flex; align-items:center; gap:4px;}
.legend-dot{width:10px; height:10px; border-radius:3px; display:inline-block;}
.legend-dot.ok{background:var(--green-bg); border:1px solid var(--green);}
.legend-dot.no{background:var(--red-bg); border:1px solid var(--red);}
.legend-dot.none{background:#fff; border:1px solid var(--border);}

@media (max-width:480px){
  .wrap{padding:14px 12px 40px;}
  .card{padding:16px 14px;}
  .qtext{font-size:16px;}
  .option{padding:11px 12px;}
  .option .label{font-size:14px;}
  .actions{flex-direction:column;}
  header h1{font-size:15px;}
  .score{font-size:12px;}
}
.btn-copy{background:#fff; color:var(--blue); border:1px solid var(--blue);}
.btn-copy:hover{background:#eaf1fe;}
.copy-toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:#202124; color:#fff; padding:10px 18px; border-radius:20px; font-size:13px;
  opacity:0; transition:opacity .25s; pointer-events:none; z-index:50;
}
.copy-toast.show{opacity:1;}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>AI-103 · Quiz 6</h1>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="score" id="scoreLabel">0 / 50 đúng</div>
      <button class="hamburger" onclick="openSidebar()" aria-label="Danh sách câu hỏi"><span></span></button>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</header>

<div class="wrap">
  <div id="quizArea"></div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>Danh sách câu hỏi</h2>
    <button class="sidebar-close" onclick="closeSidebar()">&times;</button>
  </div>
  <div class="sidebar-legend">
    <span><span class="legend-dot ok"></span>Đúng</span>
    <span><span class="legend-dot no"></span>Sai</span>
    <span><span class="legend-dot none"></span>Chưa làm</span>
  </div>
  <div class="jumpgrid" id="jumpGrid"></div>
</div>

<div class="copy-toast" id="copyToast">Đã copy prompt vào clipboard ✓</div>

<script>
/* =========================================================
   DATA — 60 câu hỏi AI-103
   type: single | multi | tf | match | order | fill
   ========================================================= */
/* =========================================================
   AI-103 Quiz 6 — 50 câu hỏi scenario-based (Cloud & AI Hub style)
   Microsoft Foundry agents, Content Understanding, RAG, observability,
   prompt shields, workflows, image generation, speech, security
   type: single | multi | tf | match | order | fill
   ========================================================= */
const quizData = [
{id:1, type:"single", text:"You are building a speech processing solution in Microsoft Foundry for a customer support platform. Supervisors must view live call transcripts and detect issues while calls are in progress. Audio arrives as a continuous stream from the telephony system. Transcripts must appear within only a few seconds. What should you do?",
 options:["Use text-to-speech to convert agent scripts into audio","Use speech translation to translate the call in real time","Use batch transcription to process the call after it ends","Use real-time speech-to-text to process streaming audio input"],
 correct:3,
 explain:"Cụm từ then chốt: 'live phone calls' và 'transcript phải xuất hiện trong vài giây' cho thấy cần xử lý audio ngay khi nhận được, không phải sau khi cuộc gọi kết thúc. Real-time speech-to-text xử lý audio streaming với độ trễ rất thấp, đúng yêu cầu. Text-to-speech làm ngược lại (text→audio); speech translation chỉ cần khi cần dịch ngôn ngữ khác, không phải yêu cầu ở đây; batch transcription chỉ hoạt động sau khi đã có file ghi âm hoàn chỉnh, không phù hợp cho giám sát trực tiếp."},

{id:2, type:"single", text:"An agent ingests scanned PDF vendor invoices containing tables and embedded QR codes. It must preserve the PDF layout in the extracted output so downstream processing can reference sections and tables. You need to extract content and layout elements and detect QR codes without requiring a language model deployment. Which built-in analyzer should you use?",
 options:["Pre-built document field schema","Pre-built read","Pre-built document search","Pre-built layout"],
 correct:3,
 explain:"Pre-built layout được thiết kế để trích xuất cấu trúc tài liệu (text, paragraph, table, selection mark...) trong khi vẫn giữ nguyên layout gốc, và hỗ trợ phát hiện barcode/QR code — tất cả không cần deploy language model. Document field schema chỉ trích xuất field định sẵn, không giữ toàn bộ layout; pre-built read chỉ là OCR lấy text, không phân tích layout sâu; document search dùng cho tìm kiếm/truy xuất, không phải trích xuất layout/QR code."},

{id:3, type:"fill", text:"An agent accepts user-uploaded screenshots via a multimodal chat model. Some screenshots contain potentially malicious embedded text. You need to prevent a prompt injection attack and ensure third-party content is treated as lower trust. How should you configure prompt shields for document attacks?",
 blanks:[
  {prefix:"Set prompt shields action to", options:["Block","Annotate","Disable the shield","Create a custom block list"], correct:"Block", suffix:","},
  {prefix:"and for additional mitigation, enable", options:["Spotlighting","OCR pre-extraction","a custom block list","annotate-only mode"], correct:"Spotlighting", suffix:"."}
 ],
 explain:"Set action = Block ngăn nội dung có prompt injection đến được model. Enable Spotlighting giúp model phân biệt system instruction đáng tin cậy với nội dung bên thứ ba (screenshot) — coi nội dung đó là lower trust. Disable shield bỏ hoàn toàn bảo vệ; annotate chỉ gắn cờ mà vẫn cho request tiếp tục (không ngăn được attack); custom block list chỉ lọc từ/cụm từ định sẵn, không chống được injection tinh vi; OCR chỉ trích xuất text, không phát hiện/ngăn injection."},

{id:4, type:"single", text:"You are building an app that generates responses via a model deployed to Foundry project one. Before sending prompts, the app must retrieve documents using Azure AI Search. Requirements: multiple client apps must use the same search configuration; key-based authentication must be prevented; admin effort must be minimized. What should you do?",
 options:["Manually configure Azure AI Search endpoints in each application","Configure an Azure AI Search connection in project one and reference the connection in each application","Use Microsoft Entra authentication directly in each application's own search configuration","Use managed identities in each application for direct Azure AI Search integration"],
 correct:1,
 explain:"Tạo connection Azure AI Search tập trung trong Foundry project cho phép nhiều ứng dụng dùng chung cấu hình, hỗ trợ Entra ID authentication (không cần key), và giảm công sức quản trị. Cấu hình endpoint thủ công cho từng app làm tăng công sức và khó đồng bộ; dù dùng Entra auth hay managed identity riêng cho từng app vẫn yêu cầu mỗi app tự cấu hình search riêng, không đạt mục tiêu tối thiểu hoá công sức quản trị."},

{id:5, type:"single", text:"A customer support agent calls an internal knowledge API tool before responding. Users report some requests take over 15 seconds, and some responses are incorrect even when the API returns expected data. You need to inspect individual agent runs to view the ordered sequence of LLM calls, tool invocations, and timing information. Which observability capability should you use?",
 options:["Token usage","Monitoring","Safety metrics","Tracing"],
 correct:3,
 explain:"Tracing ghi lại từng bước trong 1 lần chạy agent: thứ tự gọi LLM, gọi tool, prompt/response, và thời gian từng bước — giúp xác định điểm gây trễ hoặc sai sót. Token usage chỉ báo số token tiêu thụ; monitoring cho cái nhìn tổng quan sức khoẻ hệ thống, không chi tiết từng run; safety metrics đánh giá nội dung có hại, không giúp chẩn đoán latency/logic lỗi."},

{id:6, type:"match", text:"A Foundry agent used by financial analysts needs additional capabilities. Match each requirement to the correct tool.",
 rows:[
  {desc:"Ensure the agent can access up-to-date information from public websites.", correct:"Grounding with Bing Search"},
  {desc:"Ensure the agent can perform calculations during conversations.", correct:"Code interpreter"},
  {desc:"Ensure the agent can retrieve information from documents uploaded directly to the agent.", correct:"File search"}
 ],
 pool:["Grounding with Bing Search","Code interpreter","File search","Computer use","Microsoft Fabric"],
 explain:"Grounding with Bing Search lấy thông tin công khai mới nhất; code interpreter chạy Python để tính toán; file search index và truy xuất tài liệu upload trực tiếp cho agent. Computer use dùng để thao tác GUI desktop, không phải cho các tác vụ này; Microsoft Fabric là nền tảng phân tích dữ liệu doanh nghiệp, không phải tool hội thoại của agent."},

{id:7, type:"single", text:"An agent uses an OpenAPI 3.0 specification to call an external weather service. The service requires a key passed in an HTTP header; the key value is stored as a connection in project one. You need the key to be included automatically whenever the OpenAPI tool is invoked. What should you configure in the OpenAPI specification?",
 options:["A header parameter definition only","Store the key in Azure Key Vault separately","An API key security scheme","A bearer token security scheme"],
 correct:2,
 explain:"API key security scheme cho phép Foundry tự động lấy key từ connection đã cấu hình và đưa vào header cần thiết mỗi khi tool được gọi. Chỉ định nghĩa header parameter không tự lấy key từ connection; Azure Key Vault chỉ lưu secret, OpenAPI spec vẫn cần API key security scheme để dùng connection đó; bearer token scheme dành cho OAuth/JWT, không phải cho key truyền qua header như yêu cầu."},

{id:8, type:"single", text:"Three agents exist: a triage agent classifies requests, a policy agent answers policy questions via search, and an action agent creates/updates tickets via HTTP API. You need a deterministic step-based process with conditional branching and shared state across agents, optionally triggering a ticket action based on triage result, while minimizing dev effort. What should you include?",
 options:["A workflow","Threads and runs managed directly in application code","A multi-agent group chat session","Coordinating separate agent runs entirely in custom application code"],
 correct:0,
 explain:"Workflow trong Foundry hỗ trợ đúng yêu cầu: chuỗi bước xác định, chia sẻ state, có logic điều kiện, với rất ít code tuỳ chỉnh. Threads/runs quản lý hội thoại nhưng không có sẵn khả năng branching/shared state có cấu trúc; group chat phù hợp cho tương tác cộng tác linh hoạt hơn là quy trình nghiệp vụ có thể dự đoán; tự viết code điều phối agent riêng lẻ đòi hỏi nhiều công sức phát triển hơn."},

{id:9, type:"fill", text:"A customer support agent is deployed via a GitHub Actions workflow. Requirements: every production deployment must use the latest approved evaluation baseline; deployments must stop automatically if evaluation scores regress beyond tolerance. How should you configure the workflow?",
 blanks:[
  {prefix:"For evaluation comparison, compare against the", options:["latest approved baseline","previous workflow run","production deployment logs","repository default branch"], correct:"latest approved baseline", suffix:","},
  {prefix:"and if evaluation regression exceeds the configured tolerance, you should", options:["fail the workflow","continue deployment and send an alert","retry the evaluation automatically","lock the target branch"], correct:"fail the workflow", suffix:"."}
 ],
 explain:"So sánh với latest approved baseline đảm bảo mỗi bản deploy được đo theo tiêu chuẩn chất lượng đã duyệt chính thức. Khi regression vượt ngưỡng, fail workflow để ngăn deploy chất lượng thấp. So với previous run/logs/default branch đều không đại diện cho baseline đã duyệt; tiếp tục deploy+cảnh báo, tự động retry, hay khoá branch đều không đáp ứng đúng yêu cầu 'dừng tự động khi regression'."},

{id:10, type:"tf", text:"A LangChain service uses OpenTelemetry and passes a tracer via config={'callbacks': [azure_tracer]}. Company policy requires: telemetry from LangChain and OpenTelemetry must be distinguishable within the same Application Insights resource; secrets/credentials must not appear in prompts, tool arguments, or span attributes. Evaluate each statement.",
 statements:[
  {text:"The LangChain service will appear in the traces tab without configuring a tracer.", answer:false},
  {text:"Setting different OTEL service name values separates the services in Application Insights.", answer:true},
  {text:"When enable_content_recording is set to false, prompts and tool data will still be captured in telemetry.", answer:false}
 ],
 explain:"1 sai: LangChain cần được cấu hình tracer OpenTelemetry (như Azure AI OpenTelemetry tracer) và truyền vào làm callback trước khi telemetry được gửi tới Application Insights — không tự động xuất hiện nếu chưa cấu hình. 2 đúng: đặt service name khác nhau giúp phân biệt các service dù cùng gửi dữ liệu tới 1 Application Insights resource. 3 sai: đặt enable_content_recording=false sẽ tắt việc ghi lại nội dung, giúp đảm bảo prompt/tool argument/dữ liệu nhạy cảm không bị lưu vào telemetry."},

{id:11, type:"single", text:"An agent generates original images from user-supplied product photos. You need the generated images to maintain the product identity and visual characteristics of the provided photo. What should you do?",
 options:["Set the input fidelity parameter to high","Enable groundedness detection","Include a prompt and an input image only, with default settings","Decrease the temperature"],
 correct:0,
 explain:"Input fidelity = high giúp model giữ nguyên hình dáng, màu sắc, kết cấu, thương hiệu của ảnh gốc trong khi vẫn cho phép thay đổi sáng tạo theo yêu cầu. Groundedness detection kiểm tra nội dung có được hỗ trợ bởi context hay không, không liên quan tới fidelity ảnh; chỉ cung cấp prompt+ảnh input mặc định không tự đảm bảo giữ identity sản phẩm; giảm temperature chỉ giảm ngẫu nhiên, không kiểm soát trực tiếp việc giữ đặc điểm hình ảnh gốc."},

{id:12, type:"single", text:"A travel planning agent must: remember each user's preferred airline and hotel chain across future conversations; discard payment card details after the conversation ends; minimize custom development. Which implementation should you recommend?",
 options:["Store both preferences and payment details in persistent agent memory","Store preferences in persistent agent memory and retain payment information only in orchestration-managed session context","Store both preferences and payment details in conversation history","Store preferences and payment details in an Azure AI Search index"],
 correct:1,
 explain:"Persistent agent memory phù hợp để nhớ sở thích lâu dài qua nhiều cuộc hội thoại; orchestration-managed session context chỉ tồn tại trong phiên hiện tại nên payment tự động bị loại bỏ sau khi kết thúc — đáp ứng cả 2 yêu cầu với ít công sức tuỳ biến. Lưu payment vào persistent memory vi phạm yêu cầu phải bị xoá sau hội thoại; conversation history không dành cho lưu sở thích dài hạn và có thể giữ payment quá lâu; Azure AI Search dùng để index/tìm tài liệu, không phải nơi lưu payment hay preference."},

{id:13, type:"fill", text:"An agent uses tools to retrieve internal content and call external APIs, currently letting the model decide when to call tools. For a compliance workflow, requirements: every run must include a retrieval step before responding; tool calls must authenticate using the published agent's own identity, isolated from other project resources, with audit tracing.",
 blanks:[
  {prefix:"Set tool_choice to", options:["required","auto","none","optional"], correct:"required", suffix:","},
  {prefix:"and configure the tool to authenticate by using", options:["a distinct agent identity bound to the client application","storing API keys in the prompt","the shared project agent identity","an anonymous connection"], correct:"a distinct agent identity bound to the client application", suffix:"."}
 ],
 explain:"tool_choice=required buộc model phải gọi tool trước khi trả lời, đảm bảo luôn có bước retrieval. Dùng distinct agent identity bound to client application cung cấp identity riêng cho agent đã publish, cách ly khỏi resource khác trong project, và hỗ trợ audit. 'auto' để model tự quyết định (không đảm bảo retrieval); lưu API key trong prompt không an toàn và không cung cấp identity-based auth; dùng shared project identity không cách ly được như yêu cầu."},

{id:14, type:"single", text:"A chat app connects to an Azure AI Search vectorized index. Requirements: complex questions must retrieve from multiple chunks; multi-turn conversations must influence retrieval planning; retrievals must run in parallel to reduce latency. Which retrieval approach should you use?",
 options:["Iterative retrieval","Agentic RAG","Chain-of-thought","Classic RAG"],
 correct:1,
 explain:"Agentic RAG dùng 1 AI agent lập kế hoạch truy xuất: chia câu hỏi phức tạp thành nhiều query, lấy từ nhiều chunk cùng lúc, và dùng ngữ cảnh hội thoại trước đó để định hướng — đúng cả 3 yêu cầu. Iterative retrieval chạy tuần tự từng bước, không song song; chain-of-thought chỉ là kỹ thuật reasoning, không truy xuất dữ liệu; classic RAG chỉ truy xuất 1 lần duy nhất, không hỗ trợ lập kế hoạch đa lượt hay song song."},

{id:15, type:"single", text:"An agent processes scanned employee ID cards from multiple countries. Requirements: extract fields like employee ID, full name, expiration date; return values as a structured schema instead of raw text; minimize custom post-processing. Which built-in analyzer should you use?",
 options:["Pre-built layout","Pre-built document search","Pre-built document field schema","Pre-built read"],
 correct:2,
 explain:"Pre-built document field schema nhận diện các field định sẵn (employee ID, tên, ngày hết hạn) và trả về theo schema có cấu trúc, giảm tối đa xử lý hậu kỳ. Pre-built layout giữ cấu trúc tài liệu nhưng không trích field định sẵn thành schema; document search phục vụ tìm kiếm/truy xuất, không trích field; pre-built read chỉ OCR ra raw text, vẫn cần xử lý thêm để tìm field cụ thể."},

{id:16, type:"fill", text:"A deployed ticket triage agent sometimes responds without calling any tools even when a tool is required. You need to ensure the agent always calls a tool during execution. How should you complete the run payload?",
 blanks:[
  {prefix:"Configure the", options:["tool_choice","response_format","tools","type"], correct:"tool_choice", suffix:"parameter,"},
  {prefix:"and set its value to", options:["required","auto","tools","type"], correct:"required", suffix:"."}
 ],
 explain:"tool_choice kiểm soát cách model dùng tool trong khi thực thi; đặt = required buộc model phải gọi ít nhất 1 tool trước khi trả lời cuối cùng, đảm bảo bước retrieval/action luôn xảy ra. 'auto' để model tự quyết định (có thể bỏ qua tool); response_format chỉ kiểm soát định dạng output; 'tools' chỉ khai báo tool khả dụng chứ không ép buộc dùng; 'type' chỉ định loại tool/schema, không ảnh hưởng việc gọi tool."},

{id:17, type:"single", text:"A customer support agent calls an Azure OpenAI model deployment. During load testing, calls intermittently fail with HTTP 429 rate limit exceeded. You need to reduce call failures and improve reliability while staying within service/model limits. What should you do?",
 options:["Create a new thread and retry immediately on failure","Reduce the number of registered tools","Implement a retry policy that uses exponential backoff and jitter","Split uploaded content into smaller files"],
 correct:2,
 explain:"Exponential backoff tăng dần độ trễ giữa các lần retry để dịch vụ có thời gian phục hồi; jitter thêm ngẫu nhiên nhỏ để tránh nhiều client cùng retry 1 lúc — giảm va chạm request và cải thiện độ tin cậy trong giới hạn dịch vụ. Retry ngay lập tức có thể làm tăng số request bị throttle; giảm số tool đăng ký không ảnh hưởng tới rate limit của Azure OpenAI; chia nhỏ file giảm kích thước request nhưng không giải quyết nguyên nhân gốc là vượt giới hạn số lượng request."},

{id:18, type:"single", text:"Multiple prompt flow applications and agents in project one must use the same Azure AI Foundry model deployment hosted in another Azure resource. You need all applications to reuse the model configuration without duplicating connection settings. What should you recommend?",
 options:["Create a connection to the model resource","Configure a managed private endpoint","Use RBAC to manage permissions to the model deployment","Configure diagnostic settings for the model resource"],
 correct:0,
 explain:"Connection lưu endpoint và thông tin xác thực tập trung 1 nơi, mọi ứng dụng trong project có thể tham chiếu cùng connection đó, tránh trùng lặp cấu hình. Managed private endpoint chỉ cung cấp kết nối mạng an toàn, không giúp tái sử dụng cấu hình; RBAC chỉ quản lý quyền truy cập, không tập trung hoá connection; diagnostic settings chỉ dùng để thu log/metric, không liên quan tới việc chia sẻ cấu hình model."},

{id:19, type:"fill", text:"An agent answering questions via RAG is deployed automatically by GitHub Actions when a PR is approved. Requirements: validate responses remain grounded in retrieved documents before deployment; prevent merging PRs if evaluation doesn't meet quality thresholds.",
 blanks:[
  {prefix:"For evaluation to execute, choose", options:["groundedness evaluation","fluency evaluation","similarity evaluation","content safety evaluation"], correct:"groundedness evaluation", suffix:","},
  {prefix:"and for pull request policy,", options:["require the evaluation workflow to succeed before merging","automatically rerun failed evaluations until they pass","notify reviewers when evaluation fails","allow the merge and run evaluations after deployment"], correct:"require the evaluation workflow to succeed before merging", suffix:"."}
 ],
 explain:"Groundedness evaluation kiểm tra câu trả lời có được hỗ trợ bởi tài liệu truy xuất hay không — đúng nhu cầu phát hiện hallucination cho hệ RAG. Yêu cầu evaluation workflow phải pass mới cho merge tạo ra quality gate thực sự chặn PR chất lượng thấp. Fluency/similarity/content safety evaluation không đo grounding; rerun tự động không sửa được vấn đề chất lượng thực sự; chỉ cảnh báo hoặc merge trước rồi đánh giá sau đều không ngăn được deploy trước khi kiểm tra."},

{id:20, type:"single", text:"An image workflow must generate multiple alternative versions of an existing product image for marketing, preserving overall composition/lighting/subject, using built-in image generation without training a custom model. How should you configure the workflow?",
 options:["Enable image variation mode and provide the original image as input","Apply mask inpainting covering the entire image","Use text-to-image generation with a detailed description","Set the image-to-image strength parameter to 1.0"],
 correct:0,
 explain:"Image variation mode nhận ảnh gốc làm input và tạo nhiều biến thể phong cách trong khi vẫn giữ đặc điểm hình ảnh quan trọng — đúng yêu cầu marketing. Mask che toàn bộ ảnh thực chất là tái tạo lại toàn bộ, không tạo biến thể có kiểm soát; text-to-image chỉ dựa vào mô tả văn bản, khó giữ đúng composition/lighting gốc; strength=1.0 cho prompt ảnh hưởng tối đa, làm giảm mạnh ảnh hưởng của ảnh gốc."},

{id:21, type:"single", text:"An ingestion job for a RAG pipeline currently extracts only plain text from scanned multi-page-table PDFs, losing table structure, headings, and page metadata. You need OCR plus structure-aware chunking with page-number metadata preserved. How should you configure the ingestion job?",
 options:["Use advanced data parsing to reingest the documents","Use basic OCR with page-level chunking (one chunk per page)","Store each entire page as a single chunk","Use basic parsing with fixed-size chunking"],
 correct:0,
 explain:"Advanced data parsing thực hiện OCR, hiểu cấu trúc tài liệu, giữ bảng/heading, tạo chunk theo cấu trúc thông minh, và lưu metadata như số trang — đúng toàn bộ yêu cầu. Page-level chunking tuy có OCR nhưng tạo 1 chunk/trang, không giữ được cấu trúc structure-aware; lưu cả trang thành 1 chunk làm giảm độ chính xác truy xuất; basic parsing với fixed-size chunking làm mất cấu trúc, heading, quan hệ bảng, và metadata trang."},

{id:22, type:"single", text:"An agent must: download diagnostic logs from an internal web application with no exposed APIs; then analyze the downloaded log files to identify performance bottlenecks. Which combination of tools should you recommend?",
 options:["Computer use + code interpreter","File search + Microsoft Fabric","Grounding with Bing search + code interpreter","Computer use + file search"],
 correct:0,
 explain:"Computer use tương tác với GUI (mở browser, điều hướng, tải file) khi không có API — giải quyết bước tải log. Code interpreter chạy Python để phân tích log, tìm bottleneck. File search/Fabric không thể tải file từ web app nội bộ không có API; grounding with Bing chỉ truy cập web công khai, không phải internal app; computer use + file search thiếu khả năng phân tích log bằng code."},

{id:23, type:"fill", text:"An internal Q&A agent shows rising 'no relevant information found' responses and periodic HTTP 429 errors during peak hours. You need to identify whether issues stem from model unavailability, resource limits, or inference failures.",
 blanks:[
  {prefix:"For metrics, enable", options:["model availability rate and provisioned utilization","token cache match rate only","total request filtered to status code 200","time to response and total tokens"], correct:"model availability rate and provisioned utilization", suffix:","},
  {prefix:"and for diagnostic log, collect", options:["request/response","all metrics","audit","trace"], correct:"request/response", suffix:"."}
 ],
 explain:"Model availability rate cho biết deployment có sẵn sàng xử lý request không, provisioned utilization cho biết mức dùng capacity — giải thích được lỗi 429 vào giờ cao điểm. Log request/response chứa chi tiết mã HTTP, latency, lỗi từng request — giúp điều tra inference failure. Cache match rate chỉ đo hiệu quả cache; lọc theo status 200 bỏ sót request lỗi; time-to-response/total tokens chỉ đo hiệu năng/usage, không xác định nguyên nhân gốc; 'all metrics' chỉ tổng hợp, không đủ chi tiết; audit ghi hoạt động quản trị; trace có execution flow nhưng không đầy đủ chi tiết request/response cần thiết."},

{id:24, type:"multi", text:"A prompt agent used by a web app is invoked from a Python service running outside the Foundry portal. You need end-to-end tracing capturing latency breakdowns and exceptions across agent runs. Which two components can you use?", note:"Chọn 2 đáp án",
 options:["Log Analytics workspace","Application Insights","OpenTelemetry","Azure Monitor agent","Microsoft Sentinel"],
 correct:[1,2],
 explain:"OpenTelemetry instrument ứng dụng Python để thu thập distributed trace/latency/exception; Application Insights nhận telemetry đó và cung cấp dashboard, tracing, dependency map. Log Analytics chỉ lưu/truy vấn dữ liệu, không tự instrument ứng dụng; Azure Monitor agent thu thập telemetry từ VM/server, không phải ứng dụng Python; Microsoft Sentinel là nền tảng bảo mật, không phải công cụ tracing ứng dụng."},

{id:25, type:"single", text:"A customer support agent uses multiple tools during execution. Users report delays because the agent waits for several independent tool calls to complete. You need to reduce response time; the solution must be implemented in application logic. What should you do?",
 options:["Execute independent tool calls in parallel before generating the response","Increase the maximum completion tokens","Replace the model with a larger deployment","Use persistent agent memory to cache tool results across conversations"],
 correct:0,
 explain:"Vì các tool call độc lập với nhau, chạy chúng song song trong application logic giúp ứng dụng chỉ chờ tool chạy lâu nhất thay vì tổng thời gian của tất cả — giảm đáng kể latency. Tăng max completion tokens chỉ cho phép response dài hơn, không giảm trễ do tool; đổi sang model lớn hơn thường làm tăng latency inference chứ không giảm; persistent memory dùng cho cá nhân hoá qua nhiều hội thoại, không ảnh hưởng thời gian thực thi tool độc lập trong 1 lượt."},

{id:26, type:"match", text:"A customer support agent grounded in internal documentation shows: some answers unsupported by retrieved documents, and a small number of responses flagged for policy violations. Match each issue to the correct observability signal.",
 rows:[
  {desc:"Some answers are unsupported by retrieved documents.", correct:"Groundedness evaluation metrics"},
  {desc:"A small number of responses are flagged for policy violations.", correct:"Risk and safety metrics"}
 ],
 pool:["Groundedness evaluation metrics","Risk and safety metrics","Latency breakdown traces","Token usage analytics"],
 explain:"Groundedness evaluation metrics đo xem câu trả lời có được hỗ trợ bởi tài liệu truy xuất hay không — phát hiện hallucination/unsupported answer. Risk and safety metrics đánh giá nội dung có hại/vi phạm chính sách. Latency breakdown chỉ đo thời gian thực thi; token usage chỉ theo dõi mức tiêu thụ token — cả hai không đánh giá chất lượng/tuân thủ nội dung."},

{id:27, type:"single", text:"An image editing workflow must: remove background objects via mask-based inpainting; preserve original lighting/style; use built-in editing controls (not a custom model); apply edits exclusively inside the masked area. How should you configure the workflow?",
 options:["Enable image variation mode","Use text-to-image generation from a description","Use image-to-image with a high strength value","Enable mask inpainting and supply both the input image and a mask indicating which part to modify"],
 correct:3,
 explain:"Mask inpainting với ảnh gốc + mask chỉ cho phép chỉnh sửa đúng vùng được đánh dấu, giữ nguyên phần còn lại (ánh sáng, bố cục, style) — đúng toàn bộ yêu cầu. Image variation tạo biến thể toàn bộ ảnh, không giới hạn theo mask; text-to-image tạo ảnh hoàn toàn mới, không giữ được ảnh gốc; image-to-image với strength cao làm prompt ảnh hưởng mạnh, tái tạo lại phần lớn ảnh thay vì chỉ sửa vùng mask."},

{id:28, type:"single", text:"An agent uses Azure AI Search via Foundry tools to retrieve documents. The app returns an error that the specified index cannot be found, though the search service is reachable and authentication succeeds. You need to configure the request to reference the correct search index. To what should you set the index property?",
 options:["The Azure AI Search service name","The Azure AI Search endpoint URL","The Azure AI Search index name","The Microsoft Foundry project name"],
 correct:2,
 explain:"Vì kết nối và xác thực đã hoạt động, vấn đề nằm ở việc request đang tham chiếu sai index — cần đặt index property thành đúng tên index Azure AI Search. Service name chỉ định danh dịch vụ chứ không phải 1 index cụ thể; endpoint URL chỉ nơi dịch vụ đặt, không xác định index; project name của Foundry không liên quan tới việc chọn index trong Azure AI Search."},

{id:29, type:"fill", text:"You need to recommend a plan for a customer support agent: retain user preferences across multiple conversations; enable users to provide contextual grounding by uploading documents during a chat.",
 blanks:[
  {prefix:"To retain user preferences across conversations, use", options:["agent memory that uses persistent storage","conversation history","orchestration-managed session context","Azure AI Search tool"], correct:"agent memory that uses persistent storage", suffix:","},
  {prefix:"and to enable contextual grounding during chats, use", options:["the file search tool","the code interpreter tool","the Azure AI Search tool","conversation history"], correct:"the file search tool", suffix:"."}
 ],
 explain:"Persistent agent memory lưu thông tin dài hạn như sở thích, dùng lại được qua nhiều hội thoại. File search tool cho phép người dùng upload tài liệu ngay trong chat, index và truy xuất nội dung liên quan để grounding. Conversation history/session context chỉ tồn tại trong phạm vi hội thoại hiện tại; Azure AI Search tool truy xuất từ index có sẵn, không phải tài liệu upload trực tiếp; code interpreter chỉ phân tích file bằng code, không phải semantic grounding."},

{id:30, type:"single", text:"An image editing workflow must replace the sky in landscape photos with a sunset, modify only the selected sky region, preserve all foreground objects without regeneration, and use built-in editing capabilities. How should you configure the workflow?",
 options:["Enable image variation mode","Enable mask inpainting and provide the original image together with a mask covering the sky","Use text-to-image generation from a prompt","Use image-to-image with a high strength value"],
 correct:1,
 explain:"Mask inpainting với mask chỉ che vùng bầu trời cho phép chỉnh sửa đúng vùng đó trong khi giữ nguyên tiền cảnh, ánh sáng, bố cục. Image variation tạo biến thể cho toàn bộ ảnh; text-to-image tạo ảnh hoàn toàn mới không giữ được tiền cảnh gốc; image-to-image với strength cao có thể làm thay đổi cả vùng ngoài mask, không đảm bảo chỉ sửa đúng vùng chỉ định."},

{id:31, type:"single", text:"Multiple agents in project one will access the same Azure AI Search resource. You need to recommend a solution to centrally manage the Azure AI Search credentials across all agents. What should you recommend?",
 options:["Use RBAC to manage permissions to Azure AI Search","Disable key-based access control on Azure AI Search","Add a connection to the Azure AI Search resource","Configure a managed private endpoint to Azure AI Search"],
 correct:2,
 explain:"Connection tới Azure AI Search resource lưu endpoint và thông tin xác thực tập trung, mọi agent trong project có thể tham chiếu cùng 1 connection — giảm trùng lặp và đơn giản hoá quản lý credential. RBAC chỉ quản lý quyền, không tập trung hoá connection; disable key-based access chỉ đổi phương thức xác thực, không tạo connection dùng chung; managed private endpoint chỉ cung cấp kết nối mạng an toàn, không giải quyết việc chia sẻ credential/cấu hình."},

{id:32, type:"single", text:"A support agent lets users upload photos. You need to automatically classify uploaded images for harmful content and block content based on severity levels. What should you do?",
 options:["Use OCR and keyword scanning on extracted text","Configure prompt shields", "Use a custom block list","Implement image moderation"],
 correct:3,
 explain:"Image moderation phân tích ảnh theo các category có hại (bạo lực, nội dung tình dục, biểu tượng thù ghét...) và gán mức độ nghiêm trọng, cho phép chặn tự động theo ngưỡng cấu hình. OCR+keyword scanning chỉ phân tích được text trích từ ảnh, không nhận diện nội dung hình ảnh có hại trực tiếp; prompt shields bảo vệ khỏi prompt injection, không phải kiểm duyệt ảnh; block list chỉ lọc theo từ/cụm từ định sẵn, không phân loại được hình ảnh theo mức độ nghiêm trọng."},

{id:33, type:"fill", text:"A payment agent includes a function tool that issues refunds via an external API. You need a workflow that pauses for human approval and continues with the refund step only after approval is granted.",
 blanks:[
  {prefix:"For the approval step, set type to", options:["ask_question","basic_chat","data_transformation","invoke"], correct:"ask_question", suffix:","},
  {prefix:"and set the condition for the refund step to", options:["approval == 'approved'","propose_refund.output != null","true","approval != null"], correct:"approval == 'approved'", suffix:"."}
 ],
 explain:"ask_question tạm dừng workflow và chờ người dùng/người duyệt phản hồi trước khi tiếp tục — đúng cho human-in-the-loop approval. Điều kiện approval == 'approved' đảm bảo refund chỉ chạy khi được duyệt rõ ràng. basic_chat/data_transformation không tạo bước dừng chờ duyệt có cấu trúc; kiểm tra output khác null chỉ xác nhận có phản hồi, không xác nhận đã được duyệt; điều kiện luôn true sẽ cho refund chạy ngay cả khi chưa duyệt."},

{id:34, type:"single", text:"After a content update, users report an agent's answers have become less accurate. You need to identify whether the retrieved content is negatively influencing the model's generated responses. Which observability signal should you review?",
 options:["Indexer status and failure history","Latency breakdown traces","Prediction drift metrics","Groundedness evaluation metrics"],
 correct:3,
 explain:"Groundedness evaluation metrics xác định câu trả lời có được hỗ trợ bởi tài liệu truy xuất hay không — nếu content update khiến tài liệu ít liên quan hơn, metric này sẽ phản ánh. Indexer status chỉ báo việc index thành công hay không, không đánh giá chất lượng response; latency traces đo hiệu năng, không đo grounding; prediction drift dùng theo dõi thay đổi dự đoán ML theo thời gian, không phù hợp đánh giá chất lượng RAG."},

{id:35, type:"single", text:"An agent used by a legal department generates answers using documents from an Azure AI Search index. Users report some answers omit important clauses from lengthy legal documents. You must improve completeness in application logic only, without changing the search index or replacing the model. What should you do?",
 options:["Increase the number of retrieved document chunks before constructing the prompt","Configure prompt shields for the retrieval pipeline","Add content safety evaluation to the response pipeline","Lower the temperature of the model"],
 correct:0,
 explain:"Tăng số chunk tài liệu được truy xuất cung cấp context đầy đủ hơn cho model, tăng khả năng các điều khoản quan trọng được đưa vào prompt — thực hiện hoàn toàn trong application logic. Prompt shields bảo vệ khỏi injection, không cải thiện retrieval; content safety đánh giá nội dung có hại, không liên quan tới độ đầy đủ; giảm temperature chỉ giúp output ổn định hơn, không cung cấp thêm context tài liệu."},

{id:36, type:"match", text:"You must implement two Content Understanding pipelines: pipeline one for cost-effective high-volume processing of standalone PDF invoices, and pipeline two for cross-document validation using multi-step reasoning and reference data. Match each pipeline to its configuration.",
 rows:[
  {desc:"Pipeline one — cost-effective, high-volume, standalone PDF invoices.", correct:"Single file task in Standard mode"},
  {desc:"Pipeline two — cross-document validation with multi-step reasoning and reference data.", correct:"Multi-file task in Pro mode"}
 ],
 pool:["Single file task in Standard mode","Multi-file task in Pro mode","Multi-file task in Standard mode","Single file task in Pro mode"],
 explain:"Pipeline một xử lý từng invoice độc lập, không cần reasoning phức tạp, nên Standard mode + single file task là lựa chọn tiết kiệm chi phí nhất cho khối lượng lớn. Pipeline hai cần so sánh/reasoning qua nhiều tài liệu liên quan nên cần Pro mode + multi-file task. Multi-file Standard thiếu khả năng reasoning nâng cao; single file Pro chỉ xử lý được 1 tài liệu/lần nên không so sánh chéo được."},

{id:37, type:"single", text:"Scenario: A multimodal generative model accepts image uploads and uses extracted image text to generate responses. Attackers upload unsafe images and embed hidden instructions in images to manipulate the model. Proposed solution: You configure a prompt shield for user prompts. Does this solution meet the goal?",
 options:["Yes, this meets the goal","No, this does not meet the goal"],
 correct:1,
 explain:"Prompt shield cho user prompt chỉ bảo vệ khỏi instruction được người dùng gõ trực tiếp, không bảo vệ khỏi instruction ẩn trong ảnh upload (đây là indirect prompt injection / document attack). Cần bật prompt shields cho document attacks, và có thể thêm spotlighting để coi nội dung ảnh là lower trust. Vì vậy giải pháp này KHÔNG đạt mục tiêu."},

{id:38, type:"single", text:"Same scenario as before (hidden instructions embedded in uploaded images manipulating a multimodal model). Proposed solution: You configure image moderation to block unsafe content before processing the images. Does this solution meet the goal?",
 options:["Yes, this meets the goal","No, this does not meet the goal"],
 correct:1,

/* =========================================================
   STATE & RENDER LOGIC
   ========================================================= */
let current = 0;
let answered = new Array(quizData.length).fill(null); // null | true | false (correct?)
let userSel = new Array(quizData.length).fill(null);

const quizArea = document.getElementById('quizArea');
const scoreLabel = document.getElementById('scoreLabel');
const progressFill = document.getElementById('progressFill');
const jumpGrid = document.getElementById('jumpGrid');

function buildJumpGrid(){
  jumpGrid.innerHTML = '';
  quizData.forEach((q,i)=>{
    const b = document.createElement('button');
    b.textContent = i+1;
    b.onclick = ()=>{ current = i; render(); closeSidebar(); };
    jumpGrid.appendChild(b);
  });
}

function updateHeader(){
  const answeredCount = answered.filter(a=>a!==null).length;
  const correctCount = answered.filter(a=>a===true).length;
  scoreLabel.textContent = correctCount + ' / ' + quizData.length + ' đúng (' + answeredCount + ' đã làm)';
  progressFill.style.width = (answeredCount/quizData.length*100) + '%';
  Array.from(jumpGrid.children).forEach((b,i)=>{
    b.classList.remove('done-ok','done-no','current');
    if(answered[i]===true) b.classList.add('done-ok');
    else if(answered[i]===false) b.classList.add('done-no');
    if(i===current) b.classList.add('current');
  });
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function getDisplay(q){
  // Shuffles single/multi answer options once per question and remaps the
  // correct index/indices so the correct answer isn't always in the same spot.
  if(q._d) return q._d;
  if(q.type === 'single' || q.type === 'multi'){
    const order = shuffle(q.options.map((_,i)=>i));
    const newOptions = order.map(oi=>q.options[oi]);
    let newCorrect;
    if(q.type === 'single'){
      newCorrect = order.indexOf(q.correct);
    } else {
      newCorrect = q.correct.map(oc=>order.indexOf(oc));
    }
    q._d = {options:newOptions, correct:newCorrect};
  } else {
    q._d = {options:q.options, correct:q.correct};
  }
  return q._d;
}

function formatExplain(text){
  // Xuống hàng giữa các câu/mệnh đề để dễ đọc: tách sau dấu chấm khi
  // theo sau là chữ hoa hoặc số (tránh tách nhầm viết tắt như "v.v." hay "e.g.").
  var parts = text.split(/(?<=\.)\s+(?=[A-Z0-9ÀÁẢÃẠĂẰẲẴẶẤẦẨẪẬÂÈÉẺẼẸÊỀẾỂỄỆÌÍỈĨỊÒÓỎÕỌÔỒỐỔỖỘƠỜỚỞỠỢÙÚỦŨỤƯỪỨỬỮỰỲÝỶỸỴĐ])/u);
  return parts.join('<br><br>');
}

function render(){
  const q = quizData[current];
  const isDone = answered[current] !== null;
  let html = '<div class="card">';
  html += '<div class="qnum">Câu ' + (current+1) + ' / ' + quizData.length + '</div>';
  html += '<div class="qtext">' + q.text + '</div>';
  if(q.note) html += '<div class="hint">' + q.note + '</div>';

  if(q.type === 'single' || q.type === 'multi'){
    const d = getDisplay(q);
    html += '<div id="optList">';
    d.options.forEach((opt,i)=>{
      html += '<div class="option ' + (q.type==='multi'?'multi':'') + '" data-i="'+i+'" onclick="toggleOption('+i+')"><div class="mark"></div><div class="label">'+opt+'</div></div>';
    });
    html += '</div>';
  } else if(q.type === 'tf'){
    html += '<div id="tfList">';
    q.statements.forEach((s,i)=>{
      html += '<div class="statement" data-i="'+i+'"><div class="stext">'+s.text+'</div><div class="tfbtns">'+
        '<div class="tfbtn" data-val="true" onclick="setTF('+i+',true)">True / Đúng</div>'+
        '<div class="tfbtn" data-val="false" onclick="setTF('+i+',false)">False / Sai</div>'+
        '</div></div>';
    });
    html += '</div>';
  } else if(q.type === 'match'){
    if(!q._poolDisplay) q._poolDisplay = shuffle(q.pool);
    html += '<div id="matchList">';
    q.rows.forEach((r,i)=>{
      html += '<div class="matchrow" data-i="'+i+'"><div class="desc">'+r.desc+'</div><select onchange="setMatch('+i+',this.value)"><option value="">-- chọn --</option>';
      q._poolDisplay.forEach(p=>{ html += '<option value="'+p+'">'+p+'</option>'; });
      html += '</select></div>';
    });
    html += '</div>';
  } else if(q.type === 'order'){
    if(!q._display) q._display = shuffle(q.correctOrder);
    html += '<div id="orderList">';
    q._display.forEach((text,i)=>{
      html += '<div class="orderitem" data-text="'+encodeURIComponent(text)+'"><select onchange="setOrder(this)"><option value="">#</option>';
      for(let n=1;n<=q.correctOrder.length;n++) html += '<option value="'+n+'">'+n+'</option>';
      html += '</select><div class="otext">'+text+'</div></div>';
    });
    html += '</div>';
  } else if(q.type === 'fill'){
    html += '<div id="fillList">';
    q.blanks.forEach((b,i)=>{
      if(!b._displayOptions) b._displayOptions = shuffle(b.options);
      html += '<div class="fillrow" data-i="'+i+'">'+ (b.prefix?b.prefix+' ':'') +
        '<select onchange="setFill('+i+',this.value)"><option value="">-- chọn --</option>';
      b._displayOptions.forEach(o=>{ html += '<option value="'+o+'">'+o+'</option>'; });
      html += '</select> ' + (b.suffix||'') + '</div>';
    });
    html += '</div>';
  }

  html += '<div class="explain" id="explainBox"><b>Giải thích:</b><br><br>' + formatExplain(q.explain) + '</div>';
  html += '<div class="actions">';
  html += '<button class="act btn-check" id="checkBtn" onclick="checkAnswer()">Kiểm tra</button>';
  html += '<button class="act btn-copy" onclick="copyPrompt()">📋 Copy prompt hỏi AI</button>';
  html += '</div>';
  html += '<div class="navrow"><button onclick="goPrev()" '+(current===0?'disabled':'')+'>&larr; Câu trước</button><button onclick="goNext()" '+(current===quizData.length-1?'disabled':'')+'>Câu sau &rarr;</button></div>';
  html += '</div>';

  quizArea.innerHTML = html;

  // restore state if already answered
  if(isDone){
    restoreState(q);
  }
  updateHeader();
}

function toggleOption(i){
  const q = quizData[current];
  if(answered[current] !== null) return;
  if(!userSel[current]) userSel[current] = q.type==='multi' ? new Set() : null;
  const els = document.querySelectorAll('#optList .option');
  if(q.type === 'single'){
    userSel[current] = i;
    els.forEach(e=>e.classList.remove('selected'));
    els[i].classList.add('selected');
  } else {
    if(userSel[current].has(i)) userSel[current].delete(i);
    else userSel[current].add(i);
    els[i].classList.toggle('selected');
  }
}

function setTF(i,val){
  if(answered[current] !== null) return;
  if(!userSel[current]) userSel[current] = {};
  userSel[current][i] = val;
  const stmt = document.querySelectorAll('#tfList .statement')[i];
  stmt.querySelectorAll('.tfbtn').forEach(b=>b.classList.remove('selected'));
  stmt.querySelector('.tfbtn[data-val="'+val+'"]').classList.add('selected');
}

function setMatch(i,val){
  if(!userSel[current]) userSel[current] = {};
  userSel[current][i] = val;
}

function setOrder(sel){
  if(!userSel[current]) userSel[current] = {};
  const item = sel.closest('.orderitem');
  const text = decodeURIComponent(item.getAttribute('data-text'));
  userSel[current][text] = sel.value;
}

function setFill(i,val){
  if(!userSel[current]) userSel[current] = {};
  userSel[current][i] = val;
}

function checkAnswer(){
  const q = quizData[current];
  if(answered[current] !== null) return;
  let isCorrect = false;

  if(q.type === 'single'){
    const d = getDisplay(q);
    const sel = userSel[current];
    if(sel === null || sel === undefined){ alert('Hãy chọn một đáp án.'); return; }
    isCorrect = (sel === d.correct);
    const els = document.querySelectorAll('#optList .option');
    els.forEach((e,i)=>{
      if(i === d.correct) e.classList.add('correct');
      else if(i === sel) e.classList.add('incorrect');
    });
  } else if(q.type === 'multi'){
    const d = getDisplay(q);
    const sel = userSel[current] || new Set();
    if(sel.size === 0){ alert('Hãy chọn các đáp án.'); return; }
    const correctSet = new Set(d.correct);
    isCorrect = sel.size === correctSet.size && [...sel].every(x=>correctSet.has(x));
    const els = document.querySelectorAll('#optList .option');
    els.forEach((e,i)=>{
      if(correctSet.has(i)) e.classList.add('correct');
      else if(sel.has(i)) e.classList.add('incorrect');
    });
  } else if(q.type === 'tf'){
    const sel = userSel[current] || {};
    if(Object.keys(sel).length < q.statements.length){ alert('Hãy chọn True/False cho tất cả.'); return; }
    isCorrect = true;
    const stmts = document.querySelectorAll('#tfList .statement');
    q.statements.forEach((s,i)=>{
      const userVal = sel[i];
      const ok = (userVal === s.answer);
      if(!ok) isCorrect = false;
      const btn = stmts[i].querySelector('.tfbtn[data-val="'+s.answer+'"]');
      btn.classList.add('correct');
      if(!ok){
        const wrongBtn = stmts[i].querySelector('.tfbtn[data-val="'+userVal+'"]');
        if(wrongBtn) wrongBtn.classList.add('incorrect');
      }
    });
  } else if(q.type === 'match'){
    const sel = userSel[current] || {};
    if(Object.keys(sel).length < q.rows.length){ alert('Hãy chọn cho tất cả các dòng.'); return; }
    isCorrect = true;
    const rows = document.querySelectorAll('#matchList .matchrow');
    q.rows.forEach((r,i)=>{
      const ok = sel[i] === r.correct;
      if(!ok) isCorrect = false;
      rows[i].classList.add(ok?'correct':'incorrect');
      const select = rows[i].querySelector('select');
      select.disabled = true;
      if(!ok){
        const hintSpan = document.createElement('div');
        hintSpan.style.fontSize='12px'; hintSpan.style.color='#1e8e3e'; hintSpan.style.marginTop='4px';
        hintSpan.textContent = 'Đáp án đúng: ' + r.correct;
        rows[i].appendChild(hintSpan);
      }
    });
  } else if(q.type === 'order'){
    const sel = userSel[current] || {};
    if(Object.keys(sel).length < q.correctOrder.length || Object.values(sel).some(v=>!v)){ alert('Hãy chọn số thứ tự cho tất cả.'); return; }
    isCorrect = true;
    const items = document.querySelectorAll('#orderList .orderitem');
    items.forEach(item=>{
      const text = decodeURIComponent(item.getAttribute('data-text'));
      const correctPos = q.correctOrder.indexOf(text) + 1;
      const userPos = parseInt(sel[text]);
      const ok = (userPos === correctPos);
      if(!ok) isCorrect = false;
      item.classList.add(ok?'correct':'incorrect');
      item.querySelector('select').disabled = true;
      if(!ok){
        const hintSpan = document.createElement('span');
        hintSpan.style.fontSize='12px'; hintSpan.style.color='#1e8e3e'; hintSpan.style.marginLeft='8px';
        hintSpan.textContent = '(đúng: #' + correctPos + ')';
        item.appendChild(hintSpan);
      }
    });
  } else if(q.type === 'fill'){
    const sel = userSel[current] || {};
    if(Object.keys(sel).length < q.blanks.length || Object.values(sel).some(v=>!v)){ alert('Hãy chọn cho tất cả các ô trống.'); return; }
    isCorrect = true;
    const rows = document.querySelectorAll('#fillList .fillrow');
    q.blanks.forEach((b,i)=>{
      const ok = sel[i] === b.correct;
      if(!ok) isCorrect = false;
      rows[i].classList.add(ok?'correct':'incorrect');
      rows[i].querySelector('select').disabled = true;
      if(!ok){
        const hintSpan = document.createElement('span');
        hintSpan.style.fontSize='12px'; hintSpan.style.color='#1e8e3e'; hintSpan.style.marginLeft='6px';
        hintSpan.textContent = '(đúng: ' + b.correct + ')';
        rows[i].appendChild(hintSpan);
      }
    });
  }

  answered[current] = isCorrect;
  document.getElementById('checkBtn').disabled = true;
  document.getElementById('explainBox').classList.add('show');
  const badge = document.createElement('div');
  badge.className = 'result-badge ' + (isCorrect?'ok':'no');
  badge.textContent = isCorrect ? '✔ Chính xác' : '✘ Chưa đúng';
  document.getElementById('explainBox').prepend(badge);

  updateHeader();
}

function restoreState(q){
  // disable inputs and re-apply visual state after navigating back to an answered question
  const sel = userSel[current];
  if(q.type === 'single' || q.type === 'multi'){
    const d = getDisplay(q);
    const els = document.querySelectorAll('#optList .option');
    const correctSet = new Set(Array.isArray(d.correct)?d.correct:[d.correct]);
    els.forEach((e,i)=>{
      e.onclick = null;
      const userHas = q.type==='multi' ? (sel && sel.has && sel.has(i)) : (sel===i);
      if(correctSet.has(i)) e.classList.add('correct');
      else if(userHas) e.classList.add('incorrect');
    });
  } else if(q.type === 'tf'){
    const stmts = document.querySelectorAll('#tfList .statement');
    q.statements.forEach((s,i)=>{
      stmts[i].querySelectorAll('.tfbtn').forEach(b=>b.onclick=null);
      const btn = stmts[i].querySelector('.tfbtn[data-val="'+s.answer+'"]');
      btn.classList.add('correct');
      const userVal = sel ? sel[i] : undefined;
      if(userVal !== undefined && userVal !== s.answer){
        const wrongBtn = stmts[i].querySelector('.tfbtn[data-val="'+userVal+'"]');
        if(wrongBtn) wrongBtn.classList.add('incorrect');
      }
    });
  } else if(q.type === 'match'){
    const rows = document.querySelectorAll('#matchList .matchrow');
    q.rows.forEach((r,i)=>{
      const select = rows[i].querySelector('select');
      select.disabled = true;
      if(sel && sel[i]) select.value = sel[i];
      const ok = sel && sel[i] === r.correct;
      rows[i].classList.add(ok?'correct':'incorrect');
      if(!ok){
        const hintSpan = document.createElement('div');
        hintSpan.style.fontSize='12px'; hintSpan.style.color='#1e8e3e'; hintSpan.style.marginTop='4px';
        hintSpan.textContent = 'Đáp án đúng: ' + r.correct;
        rows[i].appendChild(hintSpan);
      }
    });
  } else if(q.type === 'order'){
    const items = document.querySelectorAll('#orderList .orderitem');
    items.forEach(item=>{
      const text = decodeURIComponent(item.getAttribute('data-text'));
      const select = item.querySelector('select');
      select.disabled = true;
      if(sel && sel[text]) select.value = sel[text];
      const correctPos = q.correctOrder.indexOf(text) + 1;
      const userPos = sel ? parseInt(sel[text]) : null;
      const ok = (userPos === correctPos);
      item.classList.add(ok?'correct':'incorrect');
      if(!ok){
        const hintSpan = document.createElement('span');
        hintSpan.style.fontSize='12px'; hintSpan.style.color='#1e8e3e'; hintSpan.style.marginLeft='8px';
        hintSpan.textContent = '(đúng: #' + correctPos + ')';
        item.appendChild(hintSpan);
      }
    });
  } else if(q.type === 'fill'){
    const rows = document.querySelectorAll('#fillList .fillrow');
    q.blanks.forEach((b,i)=>{
      const select = rows[i].querySelector('select');
      select.disabled = true;
      if(sel && sel[i]) select.value = sel[i];
      const ok = sel && sel[i] === b.correct;
      rows[i].classList.add(ok?'correct':'incorrect');
      if(!ok){
        const hintSpan = document.createElement('span');
        hintSpan.style.fontSize='12px'; hintSpan.style.color='#1e8e3e'; hintSpan.style.marginLeft='6px';
        hintSpan.textContent = '(đúng: ' + b.correct + ')';
        rows[i].appendChild(hintSpan);
      }
    });
  }
  document.getElementById('checkBtn').disabled = true;
  document.getElementById('explainBox').classList.add('show');
  const badge = document.createElement('div');
  badge.className = 'result-badge ' + (answered[current]?'ok':'no');
  badge.textContent = answered[current] ? '✔ Chính xác' : '✘ Chưa đúng';
  document.getElementById('explainBox').prepend(badge);
}

function buildPromptText(q){
  let body = 'Giải thích ngắn gọn, dễ hiểu bằng tiếng Việt câu hỏi AI-103 sau — vì sao đáp án đúng là đúng và các lựa chọn khác sai ở đâu:\n\n';
  body += q.text + '\n';

  if(q.type === 'single' || q.type === 'multi'){
    const d = getDisplay(q);
    d.options.forEach((opt,i)=>{ body += String.fromCharCode(65+i) + '. ' + opt + '\n'; });
    const correctArr = Array.isArray(d.correct) ? d.correct : [d.correct];
    body += 'Đáp án đúng: ' + correctArr.map(i=>String.fromCharCode(65+i)).join(', ') + '\n';
  } else if(q.type === 'tf'){
    q.statements.forEach((s,i)=>{
      body += (i+1) + '. ' + s.text + ' → ' + (s.answer?'True':'False') + '\n';
    });
  } else if(q.type === 'match'){
    q.rows.forEach((r,i)=>{
      body += (i+1) + '. ' + r.desc + ' → ' + r.correct + '\n';
    });
  } else if(q.type === 'order'){
    q.correctOrder.forEach((s,i)=>{
      body += (i+1) + '. ' + s + '\n';
    });
  } else if(q.type === 'fill'){
    q.blanks.forEach((b,i)=>{
      body += (i+1) + '. ' + (b.prefix||'') + ' ___ ' + (b.suffix||'') + ' → ' + b.correct + '\n';
    });
  }

  return body;
}

function copyPrompt(){
  const q = quizData[current];
  const text = buildPromptText(q);
  const doToast = ()=>{
    const toast = document.getElementById('copyToast');
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'), 1800);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(doToast).catch(()=>fallbackCopy(text, doToast));
  } else {
    fallbackCopy(text, doToast);
  }
}

function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(cb) cb();
}

function goPrev(){ if(current>0){ current--; render(); } }
function goNext(){ if(current<quizData.length-1){ current++; render(); } }

function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

buildJumpGrid();
render();
</script>
