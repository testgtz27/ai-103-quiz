<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AI-103 Quiz 5 (60 câu)</title>
<style>
:root{
  --green:#1e8e3e; --green-bg:#e6f4ea;
  --red:#d93025; --red-bg:#fce8e6;
  --blue:#1a73e8; --gray:#5f6368; --border:#dadce0;
}
*{box-sizing:border-box;}
body{
  font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  background:#f6f7f9; margin:0; padding:0; color:#202124;
}
.wrap{max-width:760px; margin:0 auto; padding:20px 16px 60px;}
header{position:sticky; top:0; background:#fff; border-bottom:1px solid var(--border); padding:12px 16px; z-index:5;}
header .top{display:flex; justify-content:space-between; align-items:center; max-width:760px; margin:0 auto;}
header h1{font-size:16px; margin:0;}
.progress-bar{height:6px; background:#eee; border-radius:4px; margin-top:8px; overflow:hidden;}
.progress-fill{height:100%; background:var(--blue); width:0%; transition:width .2s;}
.score{font-size:13px; color:var(--gray);}
.card{background:#fff; border:1px solid var(--border); border-radius:10px; padding:20px; margin-top:18px;}
.qnum{font-size:12px; color:var(--blue); font-weight:600; text-transform:uppercase; letter-spacing:.5px;}
.qtext{font-size:17px; font-weight:600; margin:8px 0 14px; line-height:1.4;}
.hint{font-size:13px; color:var(--gray); margin-bottom:10px;}
.option{
  display:flex; align-items:flex-start; gap:10px;
  border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:8px;
  cursor:pointer; transition:background .15s, border-color .15s;
}
.option:hover{background:#f1f4fd;}
.option .mark{
  flex:0 0 20px; height:20px; border:2px solid #bbb; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; margin-top:2px;
}
.option.multi .mark{border-radius:4px;}
.option.selected .mark{background:var(--blue); border-color:var(--blue);}
.option.correct{background:var(--green-bg); border-color:var(--green);}
.option.correct .mark{background:var(--green); border-color:var(--green);}
.option.incorrect{background:var(--red-bg); border-color:var(--red);}
.option.incorrect .mark{background:var(--red); border-color:var(--red);}
.option .label{font-size:15px; line-height:1.4;}
.statement{border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:10px;}
.statement .stext{font-size:15px; margin-bottom:10px;}
.tfbtns{display:flex; gap:8px;}
.tfbtn{flex:1; padding:8px 0; text-align:center; border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:14px; font-weight:600; color:var(--gray);}
.tfbtn:hover{background:#f1f4fd;}
.tfbtn.selected{border-color:var(--blue); color:var(--blue); background:#eaf1fe;}
.tfbtn.correct{background:var(--green-bg); border-color:var(--green); color:var(--green);}
.tfbtn.incorrect{background:var(--red-bg); border-color:var(--red); color:var(--red);}
.matchrow{display:flex; justify-content:space-between; align-items:center; gap:10px; border:1px solid var(--border); border-radius:8px; padding:10px 14px; margin-bottom:8px;}
.matchrow .desc{font-size:14px; flex:1;}
select{
  font-size:14px; padding:6px 8px; border-radius:6px; border:1px solid var(--border); background:#fff; min-width:180px;
}
.matchrow.correct{background:var(--green-bg); border-color:var(--green);}
.matchrow.incorrect{background:var(--red-bg); border-color:var(--red);}
.orderitem{display:flex; align-items:center; gap:12px; border:1px solid var(--border); border-radius:8px; padding:10px 14px; margin-bottom:8px;}
.orderitem .otext{flex:1; font-size:14px;}
.orderitem.correct{background:var(--green-bg); border-color:var(--green);}
.orderitem.incorrect{background:var(--red-bg); border-color:var(--red);}
.fillrow{margin-bottom:12px; font-size:15px; line-height:1.6;}
.fillrow select{margin:0 4px;}
.fillrow.correct select{background:var(--green-bg); border-color:var(--green);}
.fillrow.incorrect select{background:var(--red-bg); border-color:var(--red);}
.actions{display:flex; gap:10px; margin-top:18px;}
button.act{
  flex:1; padding:12px 0; border-radius:8px; border:none; font-size:15px; font-weight:600; cursor:pointer;
}
.btn-check{background:var(--blue); color:#fff;}
.btn-check:disabled{background:#c7d4f5; cursor:not-allowed;}
.btn-next{background:#202124; color:#fff;}
.explain{
  margin-top:16px; padding:14px 16px; border-radius:8px; background:#fff8e1; border:1px solid #f2d675;
  font-size:14px; line-height:1.55; display:none;
}
.explain.show{display:block;}
.explain b{color:#8a6d00;}
.result-badge{display:inline-block; padding:2px 10px; border-radius:12px; font-size:12px; font-weight:700; margin-bottom:8px;}
.result-badge.ok{background:var(--green-bg); color:var(--green);}
.result-badge.no{background:var(--red-bg); color:var(--red);}
.navrow{display:flex; justify-content:space-between; margin-top:14px;}
.navrow button{background:none; border:none; color:var(--blue); font-size:14px; cursor:pointer; padding:6px 4px;}
.navrow button:disabled{color:#ccc; cursor:not-allowed;}
.finalscreen{text-align:center; padding:40px 20px;}
.finalscreen h2{font-size:24px;}
.finalscreen .big{font-size:48px; font-weight:800; color:var(--blue); margin:10px 0;}
.jumpgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px;}
.jumpgrid button{aspect-ratio:1; border-radius:6px; border:1px solid var(--border); background:#fff; font-size:13px; cursor:pointer;}
.jumpgrid button.done-ok{background:var(--green-bg); border-color:var(--green); color:var(--green);}
.jumpgrid button.done-no{background:var(--red-bg); border-color:var(--red); color:var(--red);}
.jumpgrid button.current{outline:2px solid var(--blue);}

.hamburger{
  background:none; border:1px solid var(--border); border-radius:8px; width:36px; height:36px;
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto;
}
.hamburger span{display:block; width:16px; height:2px; background:#202124; position:relative;}
.hamburger span::before, .hamburger span::after{content:''; position:absolute; left:0; width:16px; height:2px; background:#202124;}
.hamburger span::before{top:-5px;} .hamburger span::after{top:5px;}

.sidebar-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30; display:none;
}
.sidebar-overlay.open{display:block;}
.sidebar{
  position:fixed; top:0; right:-300px; width:280px; max-width:82vw; height:100%;
  background:#fff; z-index:40; box-shadow:-2px 0 12px rgba(0,0,0,.15);
  transition:right .25s ease; overflow-y:auto; padding:16px;
}
.sidebar.open{right:0;}
.sidebar-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.sidebar-header h2{font-size:15px; margin:0;}
.sidebar-close{background:none; border:none; font-size:22px; line-height:1; cursor:pointer; color:var(--gray); padding:0 4px;}
.sidebar-legend{display:flex; gap:12px; font-size:11px; color:var(--gray); margin-bottom:12px; flex-wrap:wrap;}
.sidebar-legend span{display:inline-flex; align-items:center; gap:4px;}
.legend-dot{width:10px; height:10px; border-radius:3px; display:inline-block;}
.legend-dot.ok{background:var(--green-bg); border:1px solid var(--green);}
.legend-dot.no{background:var(--red-bg); border:1px solid var(--red);}
.legend-dot.none{background:#fff; border:1px solid var(--border);}

@media (max-width:480px){
  .wrap{padding:14px 12px 40px;}
  .card{padding:16px 14px;}
  .qtext{font-size:16px;}
  .option{padding:11px 12px;}
  .option .label{font-size:14px;}
  .actions{flex-direction:column;}
  header h1{font-size:15px;}
  .score{font-size:12px;}
}
.btn-copy{background:#fff; color:var(--blue); border:1px solid var(--blue);}
.btn-copy:hover{background:#eaf1fe;}
.copy-toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:#202124; color:#fff; padding:10px 18px; border-radius:20px; font-size:13px;
  opacity:0; transition:opacity .25s; pointer-events:none; z-index:50;
}
.copy-toast.show{opacity:1;}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>AI-103 · Quiz 5</h1>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="score" id="scoreLabel">0 / 60 đúng</div>
      <button class="hamburger" onclick="openSidebar()" aria-label="Danh sách câu hỏi"><span></span></button>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</header>

<div class="wrap">
  <div id="quizArea"></div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>Danh sách câu hỏi</h2>
    <button class="sidebar-close" onclick="closeSidebar()">&times;</button>
  </div>
  <div class="sidebar-legend">
    <span><span class="legend-dot ok"></span>Đúng</span>
    <span><span class="legend-dot no"></span>Sai</span>
    <span><span class="legend-dot none"></span>Chưa làm</span>
  </div>
  <div class="jumpgrid" id="jumpGrid"></div>
</div>

<div class="copy-toast" id="copyToast">Đã copy prompt vào clipboard ✓</div>

<script>
/* =========================================================
   DATA — 60 câu hỏi AI-103
   type: single | multi | tf | match | order | fill
   ========================================================= */
/* =========================================================
   AI-103 Quiz 5 — 60 câu hỏi (Responsible AI, model catalog,
   evaluation, code interpreter, orchestration, speech,
   language, document intelligence, search enrichment)
   type: single | multi | tf | match | order | fill
   ========================================================= */
const quizData = [
{id:1, type:"tf", text:"For each statement about AI harm and accountability, indicate True or False.",
 statements:[
  {text:"Harm from AI systems can result not only from intentional misuse, but also from incorrect predictions that affect individuals or groups.", answer:true},
  {text:"Privacy and security concerns end once a model has been trained because the production system no longer depends on incoming data.", answer:false},
  {text:"To make a prediction system understandable, it can be useful to explain how much training data was used and which input features have the strongest influence on results.", answer:true},
  {text:"Accountability for an AI system applies only to the model itself and does not extend to the logic that uses model predictions.", answer:false}
 ],
 explain:"1&3 True: harm có thể đến từ lạm dụng cố ý hoặc từ dự đoán sai; giải thích lượng dữ liệu training và feature ảnh hưởng mạnh giúp hệ thống dễ hiểu hơn. 2 False: production system vẫn xử lý dữ liệu mới liên tục, nên privacy/security vẫn quan trọng sau khi train xong. 4 False: accountability bao trùm cả business logic và quyết định con người liên quan tới việc dùng kết quả model, không chỉ riêng model."},

{id:2, type:"match", text:"Match each model catalog filter/attribute to its description.",
 rows:[
  {desc:"Used to narrow models by provider such as Azure OpenAI, Microsoft, Cohere, Mistral, Meta, or Anthropic.", correct:"Source"},
  {desc:"Used to narrow models by supported activities such as text generation, summarization, translation, image generation, or speech synthesis.", correct:"Inference tasks"},
  {desc:"Used to narrow models by supported techniques for adapting a model to a task.", correct:"Fine-tuning methods"},
  {desc:"Used to narrow models by whether they come from Azure directly or from a repository such as Hugging Face.", correct:"Collection"},
  {desc:"Used to narrow models by abilities such as reasoning, tool calling, or multimodal processing.", correct:"Capabilities"}
 ],
 pool:["Source","Inference tasks","Fine-tuning methods","Collection","Capabilities","Deployment region","Virtual machine size"],
 explain:"Source = nhà cung cấp model; Inference tasks = loại công việc model làm được; Fine-tuning methods = kỹ thuật tuỳ biến model; Collection = model đến từ đâu (Azure hay Hugging Face...); Capabilities = khả năng chức năng (reasoning, tool calling, multimodal). Deployment region và VM size thuộc hạ tầng triển khai, không phải filter catalog theo định danh/task/tuning/capability."},

{id:3, type:"tf", text:"For each statement about dataset-based evaluation, indicate True or False.",
 statements:[
  {text:"A synthetic dataset for evaluating an AI system can be created by providing a task or topic description and defining how many rows to generate.", answer:true},
  {text:"Supporting files can be included during synthetic dataset generation to help align the data with the target use case.", answer:true},
  {text:"Dataset-based evaluation is designed only for cases where model outputs must be generated as part of the evaluation run.", answer:false},
  {text:"Evaluation jobs can process rows asynchronously across the selected dataset.", answer:true}
 ],
 explain:"1,2,4 True: tạo synthetic dataset bằng mô tả task/topic + số dòng; có thể thêm supporting file để bám sát use case; evaluation job xử lý dòng bất đồng bộ. 3 False: đánh giá theo dataset cũng áp dụng được cho dữ liệu đã có sẵn output/expected value, không chỉ giới hạn ở việc phải sinh output mới."},

{id:4, type:"match", text:"Match each Code Interpreter capability to its description.",
 rows:[
  {desc:"Lets the model write and execute Python code during a conversation.", correct:"Dynamic Python execution"},
  {desc:"Allows uploaded content such as CSV, JSON, and image files to be processed.", correct:"File handling"},
  {desc:"Enables calculations, transformations, and statistical work on data.", correct:"Data analysis"},
  {desc:"Gives the model execution output so it can adjust code after an error or unexpected result.", correct:"Real-time feedback"}
 ],
 pool:["Dynamic Python execution","File handling","Data analysis","Real-time feedback","External network browsing","Unlimited memory execution"],
 explain:"Dynamic Python execution = viết/chạy code Python trong hội thoại; File handling = xử lý file upload (CSV/JSON/ảnh); Data analysis = tính toán/thống kê trên dữ liệu; Real-time feedback = xem kết quả thực thi để sửa code khi lỗi. External network browsing và unlimited memory execution không đúng vì môi trường code interpreter không có internet tự do và có giới hạn bộ nhớ."},

{id:5, type:"fill", text:"Fill in the blanks about preparing content for vector-based retrieval.",
 blanks:[
  {prefix:"A team uses an", options:["embedding model","checksum generator","assistant message","Azure virtual network"], correct:"embedding model", suffix:"to create vector representations,"},
  {prefix:"and the resulting searchable index is stored in", options:["Azure AI Search","temperature settings","Azure virtual network","an assistant message"], correct:"Azure AI Search", suffix:"."}
 ],
 explain:"Embedding model chuyển văn bản thành vector số để nắm bắt ý nghĩa ngữ nghĩa. Azure AI Search lưu trữ index có thể tìm kiếm phục vụ retrieval. Checksum generator chỉ kiểm tra tính toàn vẹn dữ liệu; assistant message chỉ là context hội thoại; virtual network và temperature không liên quan tới việc tạo embedding hay lưu index."},

{id:6, type:"fill", text:"Fill in the blanks about preparing a fine-tuning dataset for a chat model.",
 blanks:[
  {prefix:"The dataset should be stored in", options:["JSONL","CSV","an index","an embedding"], correct:"JSONL", suffix:"format,"},
  {prefix:"and each training example should typically contain messages for the", options:["system, user, and assistant roles","user and temperature roles","system and embedding roles","index and assistant roles"], correct:"system, user, and assistant roles", suffix:"."}
 ],
 explain:"JSONL lưu mỗi ví dụ training thành 1 JSON object trên 1 dòng, phù hợp cho file lớn. Mỗi ví dụ cần message cho vai trò system/user/assistant. CSV không phải cấu trúc chuẩn cho multi-message chat; embedding và index không phải role trong hội thoại; temperature là tham số sinh, không phải role."},

{id:7, type:"single", text:"A developer is building Microsoft Foundry-based generative AI applications in Visual Studio Code and wants a tool that can manage deployed resources, open integrated playgrounds for testing, configure agents visually or through YAML, and generate application integration code. Which option best fits?",
 options:["GitHub Copilot","AI Toolkit extension for Visual Studio Code","OpenAI API","Foundry Tools REST APIs"],
 correct:1,
 explain:"AI Toolkit extension cho VS Code hỗ trợ đúng workflow: quản lý resource, playground test, cấu hình agent (visual/YAML), và sinh code tích hợp. GitHub Copilot chỉ hỗ trợ viết code chung, không phải công cụ Foundry chuyên biệt. OpenAI API không cung cấp trải nghiệm tích hợp VS Code. Foundry Tools REST APIs hữu ích để gọi dịch vụ theo chương trình nhưng không có IDE experience tích hợp."},

{id:8, type:"tf", text:"For each statement about model cards and benchmarks, indicate True or False.",
 statements:[
  {text:"The benchmarks tab on a model card shows how one model performs across metrics and datasets with charts comparing it to similar models.", answer:true},
  {text:"Scenario leaderboards are useful when a workload maps to a specific use case such as reasoning, coding, math, question answering, or groundedness.", answer:true},
  {text:"For batch processing jobs, latency and throughput must always be prioritized ahead of cost.", answer:false},
  {text:"HarmBench evaluates only copyright-related risk and does not address any other harmful behavior category.", answer:false}
 ],
 explain:"1&2 True: benchmarks tab so sánh 1 model với các model tương tự; scenario leaderboard hữu ích khi workload map với use case cụ thể. 3 False: batch processing không phải lúc nào cũng ưu tiên latency/throughput hơn cost — nhiều trường hợp cost quan trọng hơn. 4 False: HarmBench đánh giá nhiều loại harmful behavior, không chỉ giới hạn ở copyright."},

{id:9, type:"order", text:"Arrange the steps for continuing a multi-turn chat using Chat Completions in the correct order.",
 correctOrder:["Add the new user message to the conversation history","Submit the full conversation history to create a completion","Read the assistant's reply from the returned completion","Append the assistant reply to the conversation history"],
 explain:"Thêm message người dùng mới vào lịch sử → gửi toàn bộ lịch sử hội thoại để tạo completion → đọc phản hồi assistant từ kết quả trả về → thêm phản hồi đó vào lịch sử để dùng cho lượt tiếp theo."},

{id:10, type:"single", text:"A development team wants an AI assistant to look up order details from an internal API and create support tickets when appropriate, while the application keeps control over how the operations are executed. Which tool is the best fit?",
 options:["File search","Web search","Function","Code interpreter"],
 correct:2,
 explain:"Function cho phép model yêu cầu thực hiện thao tác (gọi API nội bộ, tạo ticket) trong khi ứng dụng vẫn kiểm soát cách thực thi thật sự. File search chỉ truy xuất tài liệu đã index; web search chỉ tìm internet công khai; code interpreter chạy Python cho tính toán, không phải để gọi business logic có kiểm soát."},

{id:11, type:"single", text:"A developer notices that a model sometimes ignores an instruction placed near the beginning of a long prompt even though the instruction is clearly written. Which adjustment is most appropriate?",
 options:["Lower the temperature so the model produces shorter replies","Replace the system message with a larger assistant message","Repeat the most important instruction near the end of the prompt","Increase top P so the model considers a broader range of tokens"],
 correct:2,
 explain:"Lặp lại instruction quan trọng gần cuối prompt giúp model tuân theo tốt hơn vì prompt dài có thể làm giảm ảnh hưởng của instruction ở đầu. Temperature điều chỉnh độ ngẫu nhiên, không liên quan tới vị trí instruction; thay system message bằng assistant message lớn hơn không giải quyết vấn đề vị trí; top P thay đổi phạm vi token được chọn, không liên quan tới việc instruction bị bỏ qua vì nằm quá sớm."},

{id:12, type:"multi", text:"Leadership wants to verify a generative AI assistant has gone through standard pre-release review functions for organizational readiness. Which four review areas should be included?", note:"Chọn 4 đáp án",
 options:["Legal","Privacy","Brand marketing","Security","Accessibility"],
 correct:[0,1,3,4],
 explain:"Legal, Privacy, Security, và Accessibility là các mảng review chuẩn trước khi phát hành: pháp lý/hợp đồng, dữ liệu cá nhân, rủi ro an ninh, và khả năng tiếp cận cho người dùng đa dạng. Brand marketing hỗ trợ truyền thông ra mắt nhưng không thay thế các review readiness bắt buộc này."},

{id:13, type:"single", text:"A retail company needs one team's chat experience to answer customer questions and draft product descriptions, and another team's software to complete structured support tasks by following instructions and calling tools. Which capability best fits both requirements?",
 options:["Computer vision","Information extraction","Generative AI and agents","Computer speech"],
 correct:2,
 explain:"Generative AI tạo phản hồi tự nhiên (trả lời khách, viết mô tả sản phẩm), còn agents theo instruction và dùng tool để hoàn thành task có cấu trúc — đáp ứng cả 2 yêu cầu. Computer vision xử lý ảnh/video; information extraction chỉ trích xuất chi tiết, không tạo nội dung mở; computer speech tập trung vào giọng nói, không phù hợp với chat/agent task ở đây."},

{id:14, type:"multi", text:"A team generates synthetic data for a formal evaluation run without a ready-made test file. Which three statements are correct?", note:"Chọn 3 đáp án",
 options:["Synthetic dataset generation requires choosing the resource that will generate the data","Evaluation results are limited to a single overall pass or fail value with no prompt level detail","Completed evaluation results can show both overall metric summaries and row-level prompt details","Synthetic dataset generation can be started only after uploading a model-generated output file with pre-filled answers","The evaluator library is opened from the project's evaluation area"],
 correct:[0,2,4],
 explain:"Cần chọn resource sinh dữ liệu; kết quả evaluation hoàn tất có thể xem cả tổng quan lẫn chi tiết từng dòng/prompt; evaluator library được mở từ khu vực evaluation của project. Kết quả không chỉ giới hạn pass/fail đơn giản, và tạo synthetic data không yêu cầu phải có sẵn file output điền trước."},

{id:15, type:"multi", text:"A user wants a more imaginative answer while also limiting the size of the model output. Which two parameters are the best fit?", note:"Chọn 2 đáp án",
 options:["ID","Temperature","Max output tokens","Previous response ID"],
 correct:[1,2],
 explain:"Temperature điều chỉnh độ sáng tạo/ngẫu nhiên của output; max output tokens giới hạn độ dài phản hồi. ID chỉ định danh response sau khi tạo, không kiểm soát việc sinh; previous response ID chỉ giúp duy trì context hội thoại, không liên quan tới sáng tạo hay độ dài."},

{id:16, type:"single", text:"A team wants full control over which prior messages are included in each request and may later trim older turns or reload stored history from a database. Which approach best supports that design?",
 options:["Replace user messages with response IDs in every request","Rely on token usage totals as the conversation record","Use only a single prompt with no conversation state","Build and manage the conversation history manually"],
 correct:3,
 explain:"Tự xây và quản lý lịch sử hội thoại cho phép ứng dụng toàn quyền chọn message nào giữ/xoá/tải lại từ database. Dùng response ID thay message không cho kiểm soát chi tiết từng message; token usage chỉ đo mức tiêu thụ, không phải nội dung hội thoại; dùng 1 prompt duy nhất loại bỏ hoàn toàn context nhiều lượt cần quản lý."},

{id:17, type:"single", text:"A team has already identified and prioritized several harmful behaviors and wants to compare future mitigation changes against current behavior. What should they establish first?",
 options:["A list of model architecture alternatives for future retraining","A production deployment schedule for the next three releases","A baseline that quantifies the harms observed in defined usage scenarios","A user satisfaction survey focused on response tone"],
 correct:2,
 explain:"Cần thiết lập baseline định lượng mức độ harm hiện tại để so sánh với các thay đổi mitigation trong tương lai. Danh sách kiến trúc thay thế, lịch triển khai, hay khảo sát về tone không đo lường được mức độ harm hiện tại để làm điểm so sánh."},

{id:18, type:"single", text:"A product owner wants post-release telemetry to evaluate satisfaction and usability, but legal is concerned about privacy. What is the best approach?",
 options:["Collect all available telemetry because operational insight takes priority over privacy constraints","Avoid collecting telemetry entirely because privacy concerns always outweigh operational needs","Collect telemetry that helps assess satisfaction and functional gaps while ensuring the data handling complies with privacy laws and organizational privacy commitments","Rely only on internal staff opinions instead of telemetry so no user-related data is involved"],
 correct:2,
 explain:"Cách tiếp cận đúng là thu thập telemetry hữu ích cho đánh giá trải nghiệm nhưng vẫn tuân thủ luật/privacy commitment. Thu thập toàn bộ bất chấp privacy tạo rủi ro tuân thủ; không thu thập gì cũng quá cực đoan; chỉ dựa vào ý kiến nhân viên nội bộ không thay thế được dữ liệu vận hành thực tế."},

{id:19, type:"fill", text:"Fill in the blanks about Azure Functions concepts.",
 blanks:[
  {prefix:"In Azure Functions,", options:["triggers","connectors","schemas","policies"], correct:"triggers", suffix:"define when code executes,"},
  {prefix:"while", options:["bindings","connectors","schemas","policies"], correct:"bindings", suffix:"simplify connections to input or output data sources."}
 ],
 explain:"Trigger định nghĩa sự kiện/điều kiện khởi chạy function (HTTP request, timer, message trong queue...). Binding đơn giản hoá việc kết nối input/output data source. Connector, schema, policy không phải khái niệm mô tả đúng trigger/binding trong Azure Functions."},

{id:20, type:"fill", text:"Fill in the blanks about dynamic tool discovery via MCP.",
 blanks:[
  {prefix:"With dynamic tool discovery, an agent queries a centralized", options:["MCP server","storage queue","transcript archive","emulator"], correct:"MCP server", suffix:"which acts as a live"},
  {prefix:"", options:["catalog","storage queue","transcript archive","emulator"], correct:"catalog", suffix:"of tools the agent can understand and call."}
 ],
 explain:"MCP server là điểm khám phá tập trung nơi tool được công bố cho agent/client. Catalog thể hiện tập tool khả dụng hiện tại mà agent có thể hiểu và gọi. Storage queue dùng cho xử lý message; transcript archive lưu lịch sử hội thoại; emulator dùng để test hành vi — không phải nguồn khám phá tool trung tâm."},

{id:21, type:"match", text:"Match each workflow requirement to the correct flow node.",
 rows:[
  {desc:"Branch execution according to whether a condition is met.", correct:"If/Else"},
  {desc:"Move execution directly to another node in the workflow.", correct:"Go To"},
  {desc:"Repeat the same action for each item in a list.", correct:"For Each"}
 ],
 pool:["If/Else","Go To","For Each","Set Variable","Parse Value"],
 explain:"If/Else rẽ nhánh theo điều kiện; Go To nhảy trực tiếp tới node khác; For Each lặp qua từng item trong danh sách. Set Variable chỉ lưu giá trị; Parse Value chỉ trích xuất/định dạng lại dữ liệu — cả hai không điều khiển nhánh/nhảy/lặp."},

{id:22, type:"match", text:"Match each Microsoft Agent Framework concept to its description.",
 rows:[
  {desc:"Maintains persistent conversation context across interactions.", correct:"Agent session"},
  {desc:"Acts as the common foundation that gives different agent types a unified interface.", correct:"Base agent"},
  {desc:"Organizes communication using user, assistant, system, and tool roles.", correct:"Chat messages"},
  {desc:"Extends an agent with custom functions that can connect to external APIs or services.", correct:"Function tools"},
  {desc:"Enables agents to work with text, images, and typed responses.", correct:"Multimodal support"}
 ],
 pool:["Agent session","Base agent","Chat messages","Function tools","Multimodal support","Web search","Azure CLI credential"],
 explain:"Agent session = duy trì context hội thoại; Base agent = nền tảng chung cho các loại agent; Chat messages = cấu trúc theo role user/assistant/system/tool; Function tools = mở rộng agent bằng function tuỳ chỉnh; Multimodal support = làm việc với text/ảnh/typed response. Web search chỉ là 1 tool cụ thể; Azure CLI credential là phương thức xác thực, không phải khái niệm cốt lõi của framework ở đây."},

{id:23, type:"tf", text:"For each statement about AI agents and agent frameworks, indicate True or False.",
 statements:[
  {text:"An AI agent can use large language model reasoning together with conventional application logic to interpret a request, choose actions, and complete tasks.", answer:true},
  {text:"The agent framework supports only fully autonomous workflows and does not allow human participation during execution.", answer:false},
  {text:"An agent can use built-in tools to run code, search documents, or retrieve information from the web.", answer:true},
  {text:"A provider-agnostic agent framework enables developers to move between supported AI providers without redesigning the application code.", answer:true}
 ],
 explain:"1,3,4 True. 2 False: agent framework vẫn hỗ trợ con người tham gia (review, approval, can thiệp) khi cần oversight, không chỉ chạy autonomous hoàn toàn."},

{id:24, type:"fill", text:"Fill in the blanks about A2A service discovery and server framework.",
 blanks:[
  {prefix:"A discoverable A2A service typically exposes its agent card at", options:["/.well-known/agentcard.json","/agent/skills.json","/task-store/agentcard.json","/request-handler/card.json"], correct:"/.well-known/agentcard.json", suffix:","},
  {prefix:"and a Python implementation can use", options:["Starlette","Uvicorn","Task store","Request handler"], correct:"Starlette", suffix:"as the web framework for the server application."}
 ],
 explain:"/.well-known/agentcard.json là đường dẫn discovery chuẩn để client/peer agent lấy agent card. Starlette được dùng làm web framework xử lý tầng HTTP cho server application. Uvicorn chỉ chạy ứng dụng như ASGI server (không phải framework); task store quản lý dữ liệu task runtime; request handler định tuyến cuộc gọi runtime — cả hai không phải framework web hay endpoint discovery."},

{id:25, type:"multi", text:"A developer is creating a new model deployment for agent use in Visual Studio Code. Which three settings are configured during that deployment process?", note:"Chọn 3 đáp án",
 options:["Deployment name","Model version","Workspace wallpaper","Agent archive policy","Keyboard shortcut profile","Capacity settings"],
 correct:[0,1,5],
 explain:"Deployment name định danh deployment; model version chỉ định phiên bản model; capacity settings kiểm soát throughput/sizing. Workspace wallpaper, agent archive policy, và keyboard shortcut profile chỉ là tuỳ chọn giao diện/quản lý agent, không thuộc cấu hình deployment model."},

{id:26, type:"single", text:"A company wants to avoid designing and maintaining a custom retrieval knowledge layer for every business unit, so it chooses a ready-made knowledge platform. What value does that platform provide?",
 options:["It removes the need for any internal knowledge sources","It replaces retrieval with static model-only answering","It reduces the complexity of custom retrieval-based implementations","It guarantees that no governance controls are needed"],
 correct:2,
 explain:"Nền tảng knowledge có sẵn giúp giảm công sức kỹ thuật khi xây/duy trì hệ retrieval riêng cho từng business unit. Nó vẫn cần nguồn kiến thức nội bộ, không thay retrieval bằng câu trả lời tĩnh, và governance/compliance vẫn cần thiết khi dùng dữ liệu tổ chức."},

{id:27, type:"single", text:"A business intelligence group wants agents to answer questions using unstructured material stored in a Microsoft Fabric Lakehouse (reports, data, documentation, analytical findings, research outputs). Which source should be added to the knowledge base?",
 options:["OneLake","Web","SharePoint remote","Azure Blob Storage"],
 correct:0,
 explain:"OneLake là nguồn dành cho nội dung không cấu trúc trong Microsoft Fabric Lakehouse. Web dùng cho grounding công khai; SharePoint remote kết nối dữ liệu SharePoint trực tiếp; Azure Blob Storage dùng cho container lưu trữ Azure — không phải Fabric OneLake."},

{id:28, type:"tf", text:"For each statement about sequential orchestration, indicate True or False.",
 statements:[
  {text:"In sequential orchestration, agents decide dynamically which participant should run next based on intermediate results.", answer:false},
  {text:"A downstream stage can depend on information added by an earlier stage in the pipeline.", answer:true},
  {text:"Sequential orchestration is a weak fit when the workflow requires iteration, backtracking, or dynamic routing.", answer:true},
  {text:"A final result from a sequential workflow can include the full conversation history showing contributions from each agent.", answer:true}
 ],
 explain:"1 False: sequential orchestration theo thứ tự cố định, không tự chọn agent tiếp theo dựa trên kết quả trung gian. 2,3,4 True: stage sau có thể dùng thông tin từ stage trước; pattern này không phù hợp khi cần lặp/quay lại/routing động; kết quả cuối có thể gồm cả lịch sử đóng góp của từng agent."},

{id:29, type:"single", text:"A developer wants to customize how a managed multi-agent discussion works — deciding when to ask for human input, when to stop, and which agent speaks next. What is the correct approach?",
 options:["Extend Group Chat Manager and override the relevant manager methods","Replace all agents with tools and remove the conversation controller","Use Sequential Builder so the conversation manager can be skipped entirely","Run all agents once in parallel and ignore turn selection afterward"],
 correct:0,
 explain:"Kế thừa Group Chat Manager và override method liên quan là cách đúng để tuỳ biến turn selection, human input, và termination trong group chat có quản lý. Thay agent bằng tool không thay thế được controller; Sequential Builder không có mô hình discussion quản lý tương tự; chạy song song 1 lần bỏ qua hoàn toàn việc điều khiển lượt nói."},

{id:30, type:"single", text:"A project team wants internal SharePoint content as the primary knowledge source, but also wants an agent to supplement answers with current public information when internal material doesn't cover a request. What is the best design choice?",
 options:["Use only web grounding and remove internal sources","Use only SharePoint content and avoid any supplementary source","Combine internal SharePoint data with web grounding in one knowledge base","Create separate agents that cannot share any knowledge configuration"],
 correct:2,
 explain:"Kết hợp SharePoint (nguồn chính) và web grounding (bổ sung) trong 1 knowledge base đáp ứng cả 2 yêu cầu. Chỉ dùng web bỏ mất nguồn nội bộ tin cậy; chỉ dùng SharePoint không cho phép bổ sung thông tin công khai mới; tạo agent riêng biệt không chia sẻ config đi ngược lại yêu cầu kết hợp nguồn."},

{id:31, type:"single", text:"A solution designer is building a workflow in Microsoft Foundry and wants a visual way to understand how actions are connected and how execution moves across the process. What does each node represent?",
 options:["A fixed report that can only display previous outputs","A specific action within the workflow","A complete workflow pattern that cannot be edited","A storage container for archived chat sessions"],
 correct:1,
 explain:"Mỗi node đại diện cho 1 hành động cụ thể trong workflow (gọi agent, xử lý logic, biến đổi dữ liệu, gửi message, kết thúc...). Nó không phải báo cáo cố định, không phải toàn bộ pattern không sửa được, và không phải nơi lưu trữ chat session."},

{id:32, type:"single", text:"A support workflow receives a collection of tickets and must apply the same action to each ticket without duplicating nodes. Which approach best fits this requirement?",
 options:["Use a For Each node with Power Fx to iterate over the collection","Use an End node after the first ticket is processed","Use only a single variable with no loop","Use a basic chat node to repeat the same message manually"],
 correct:0,
 explain:"For Each node kết hợp Power Fx cho phép lặp qua từng ticket trong collection và áp dụng cùng 1 hành động mà không cần tạo nhiều node trùng lặp. End node sau ticket đầu tiên sẽ dừng workflow sớm; chỉ dùng biến không tự động lặp; basic chat lặp thủ công không cung cấp cơ chế loop có cấu trúc."},

{id:33, type:"single", text:"A team wants an enterprise-ready agent runtime that already includes function execution, planning, and memory access while handling tool invocation without manual parsing. What are they looking for?",
 options:["A standalone agent session object","A single Azure Function with prompt text","A web search tool instance","A Microsoft Foundry agent"],
 correct:3,
 explain:"Microsoft Foundry agent cung cấp runtime enterprise-ready đầy đủ: planning, memory access, function execution, và tự xử lý tool invocation. Agent session object chỉ theo dõi trạng thái hội thoại; 1 Azure Function chỉ thực hiện 1 tác vụ callable; web search tool chỉ thêm khả năng tìm kiếm — không phải runtime hoàn chỉnh."},

{id:34, type:"single", text:"A team wants: one AI component gathers information, another evaluates findings, a third produces a recommendation — and wants to change orchestration style later without rewriting core agent logic. Which framework capability best supports that design?",
 options:["A requirement that each agent run as a completely isolated single-turn process","A built-in restriction that one project can contain only one agent","A static prompt file that replaces workflow design","A unified orchestration interface for multiple agent collaboration patterns"],
 correct:3,
 explain:"1 unified orchestration interface cho phép nhiều agent cộng tác và đổi kiểu orchestration mà không cần viết lại logic agent gốc. Isolated single-turn process ngăn cản cộng tác; giới hạn 1 agent/project mâu thuẫn với yêu cầu nhiều component; static prompt file không cung cấp cấu trúc điều phối đa agent."},

{id:35, type:"multi", text:"A team is implementing an executor for an agent that may need to stop a long-running task and also return progress as work continues. Which two operations belong in the executor design?", note:"Chọn 2 đáp án",
 options:["Cancel","Publish","Discover","Execute"],
 correct:[0,3],
 explain:"Cancel xử lý yêu cầu dừng task đang chạy; Execute xử lý công việc đến và tạo output khi task tiến triển. Publish liên quan tới việc công bố thông tin để discovery, không phải chạy/dừng task; Discover là việc client/routing tìm agent capability, không thuộc logic executor xử lý task."},

{id:36, type:"single", text:"A workflow needs to send a message to a user, ask a question, and capture the reply so later logic can use that information. Which node type best supports this interaction?",
 options:["Invoke","Basic chat","Flow","Data transformation only"],
 correct:1,
 explain:"Basic chat hỗ trợ giao tiếp trực tiếp với người dùng: gửi message, hỏi câu hỏi, và lưu lại phản hồi để dùng sau. Invoke dùng để gọi AI agent, không phải thu thập phản hồi người dùng trực tiếp; Flow kiểm soát nhánh/lặp; data transformation chỉ xử lý giá trị/biến."},

{id:37, type:"multi", text:"Which three statements accurately describe capabilities of the Microsoft Foundry visual workflow designer?", note:"Chọn 3 đáp án",
 options:["The designer can show nodes arranged in the order they execute","The canvas allows nodes to be moved, additional steps to be inserted, and configuration details to be inspected directly","The visual layout can make orchestration logic and agent interaction easier to understand","Node placement is fixed after the first save and cannot be changed later","Configuration details can be viewed only after exporting the workflow"],
 correct:[0,1,2],
 explain:"Designer hiển thị node theo thứ tự thực thi; canvas cho phép di chuyển node, thêm bước, và xem chi tiết cấu hình trực tiếp; layout trực quan giúp dễ hiểu logic điều phối. Vị trí node không bị khoá cứng sau lần save đầu tiên, và có thể xem chi tiết cấu hình ngay trong designer mà không cần export."},

{id:38, type:"single", text:"An architect is designing a long-running support assistant: some conversations should start quickly with minimal setup, others must preserve continuity over time by reusing the same thread. Which capability addresses both needs?",
 options:["Thread management that supports automatic creation and explicit handling","Code interpreter execution with persistent variables","Azure AI Search index configuration","Project connection strings stored in application settings"],
 correct:0,
 explain:"Thread management hỗ trợ cả tạo tự động (bắt đầu nhanh) lẫn xử lý tường minh (tái sử dụng thread để giữ continuity). Code interpreter chạy code tính toán, không quản lý vòng đời thread hội thoại; Azure AI Search hỗ trợ retrieval, không quản lý thread; connection string chỉ giúp định vị resource, không kiểm soát việc tạo/tái sử dụng thread."},

{id:39, type:"tf", text:"For each statement about programmatic agent access, indicate True or False.",
 statements:[
  {text:"A client application can communicate with an agent programmatically by sending requests through the OpenAI responses API.", answer:true},
  {text:"During development, an AI project client can be initialized by using a Foundry project endpoint together with default Azure credential.", answer:true},
  {text:"The get_openai_client method is used to obtain an OpenAI client from the project client.", answer:true},
  {text:"Tool calls performed by an agent can be reviewed only in the portal and are not available in the programmatic response returned to an application.", answer:false}
 ],
 explain:"1,2,3 True: ứng dụng có thể gửi request qua OpenAI responses API; project client khởi tạo bằng Foundry project endpoint + default Azure credential; get_openai_client lấy OpenAI client từ project client. 4 False: hoạt động tool call vẫn xuất hiện được trong response trả về theo chương trình, không chỉ xem được trên portal."},

{id:40, type:"match", text:"Match each Azure speech-to-text component/outcome to its description.",
 rows:[
  {desc:"Encapsulates the connection details needed to reach the Azure speech service.", correct:"Speech config"},
  {desc:"Defines the audio input source and can use a file instead of the default input device.", correct:"Audio config"},
  {desc:"Acts as the client object that calls speech recognition functions.", correct:"Speech recognizer"},
  {desc:"Represents the response returned after a recognition operation completes.", correct:"Speech recognition result"}
 ],
 pool:["Speech config","Audio config","Speech recognizer","Speech recognition result","Speech synthesizer","Translation recognizer"],
 explain:"Speech config lưu thông tin kết nối dịch vụ; Audio config định nghĩa nguồn audio đầu vào (mic hoặc file); Speech recognizer là client object gọi hàm nhận diện; Speech recognition result là kết quả trả về sau khi nhận diện. Speech synthesizer dùng để tạo giọng nói từ text (ngược lại); translation recognizer dùng cho kịch bản dịch, không phải recognition thông thường."},

{id:41, type:"tf", text:"For each statement about speech recognition/synthesis and secrets, indicate True or False.",
 statements:[
  {text:"The speech recognition capability can work with common audio formats such as WAV, MP3, OGG, FLAC, MP4, M4A, and AAC.", answer:true},
  {text:"Text to speech is limited to a single built-in voice and cannot vary by language or locale.", answer:false},
  {text:"A generated speech file can be stored in blob storage and then returned to the user through a link.", answer:true},
  {text:"Keys and SAS URLs should be embedded in source code so deployment scripts can find them more easily.", answer:false}
 ],
 explain:"1&3 True: speech recognition hỗ trợ nhiều format audio phổ biến; audio đã tạo có thể lưu blob storage và trả về qua link. 2 False: text-to-speech hỗ trợ nhiều ngôn ngữ/giọng theo locale, không giới hạn 1 giọng duy nhất. 4 False: key/SAS URL nên được bảo vệ trong secret storage an toàn, không nên nhúng trực tiếp vào source code."},

{id:42, type:"single", text:"A solution architect is comparing endpoints for a voice agent connecting via an AI Foundry project vs. a direct model connection. Which statement correctly describes the difference?",
 options:["Both connection types require separate endpoints for each model version","Project and model connections use different paths, and the model name is embedded only in the host name","Project connections use the services.ai.azure.com host while model connections use the cognitiveservices.azure.com host","Model connections always require agent ID and project ID in the query string"],
 correct:2,
 explain:"Project-based connection dùng host của Foundry project (services.ai.azure.com), còn model connection trực tiếp dùng host Azure AI Services (cognitiveservices.azure.com). Không phải mỗi model version cần endpoint riêng; điểm khác biệt chính là host chứ không chỉ là path/tên model trong host; agent ID/project ID gắn với kịch bản project/agent, không phải mọi model connection trực tiếp."},

{id:43, type:"fill", text:"Fill in the blanks about storing voice live settings as chunked agent metadata.",
 blanks:[
  {prefix:"Because each metadata entry can contain a maximum of", options:["512","256","1024","128"], correct:"512", suffix:"characters, the helper function divides longer configuration values into multiple chunks."},
  {prefix:"The first chunk is written by using the metadata key", options:["Microsoft.voicelive.configuration","Microsoft.voicelive.settings","azure.voice.configuration","Microsoft.voicelive.chunk1"], correct:"Microsoft.voicelive.configuration", suffix:"."}
 ],
 explain:"Giới hạn 512 ký tự/entry metadata khiến helper function phải chia cấu hình dài thành nhiều chunk. Chunk đầu tiên dùng key 'Microsoft.voicelive.configuration'. 256/1024 không đúng giới hạn thực tế; các key khác không phải key gốc dùng cho chunk đầu tiên."},

{id:44, type:"single", text:"A Python audio callback captures microphone input and prepares it for sending to the live service. What transformation is applied before appending the audio to the input buffer?",
 options:["The raw input is converted into a JPEG image","The raw input is Base64 encoded","The raw input is compressed into a ZIP archive","The raw input is written into agent metadata"],
 correct:1,
 explain:"Audio thô được mã hoá Base64 để chuyển thành dạng an toàn cho text trước khi thêm vào buffer input streaming. Không liên quan tới JPEG (định dạng ảnh), ZIP (đóng gói file), hay ghi vào metadata (dùng cho cấu hình, không phải audio runtime)."},

{id:45, type:"single", text:"A text analytics solution needs to identify references to people, places, dates, organizations, and similar items within sentences. Which Azure Language capability should be used?",
 options:["Language detection","Document translation","Sentiment analysis","Named entity recognition"],
 correct:3,
 explain:"Named entity recognition nhận diện và phân loại các thực thể như person/location/date/organization trong văn bản. Language detection chỉ xác định ngôn ngữ; document translation dịch ngôn ngữ; sentiment analysis đánh giá cảm xúc/ý kiến — không trích xuất thực thể có tên."},

{id:46, type:"single", text:"Validating NER output for: 'Microsoft was founded on April 4th, 1975 by Bill Gates and Paul Allen in Albuquerque, New Mexico.' Which option correctly maps the detected entities to their categories?",
 options:["Microsoft: Person, April 4th 1975: Organization, Bill Gates: Location, Albuquerque: DateTime","Microsoft: Organization, April 4 1975: URL, Bill Gates: Email, Albuquerque: Person","Microsoft: Location, April 4th 1975: Person, Bill Gates: Organization, Albuquerque: Address","Microsoft: Organization, April 4th 1975: DateTime, Bill Gates: Person, Albuquerque: Location"],
 correct:3,
 explain:"Microsoft là 1 tổ chức (Organization); April 4th 1975 là ngày tháng (DateTime); Bill Gates là người (Person); Albuquerque là địa điểm (Location) — đây là cách gán đúng. Các đáp án khác gán sai loại cho từng thực thể (ví dụ coi ngày tháng là URL, tên người là email...)."},

{id:47, type:"single", text:"A multitask prompt asks an agent to identify entities and dates in a customer review and determine whether the review is positive or negative. How is that request handled?",
 options:["The agent must use only one tool per user message, even when the prompt contains multiple tasks","The agent can answer only the sentiment portion because entity extraction and date extraction cannot be combined","The agent must split the request into separate conversations before any tool can be used","The agent can call multiple MCP tools in one turn and combine their outputs into a single answer"],
 correct:3,
 explain:"Agent có thể gọi nhiều MCP tool trong cùng 1 lượt (1 tool cho entity, 1 tool cho date, 1 tool cho sentiment) rồi gộp kết quả thành 1 câu trả lời. Nó không bị giới hạn 1 tool/message, không cần tách thành nhiều hội thoại riêng, và các tác vụ phân tích khác nhau vẫn kết hợp được trong cùng request."},

{id:49, type:"multi", text:"A browser-based voice assistant must authenticate to a Voice Live API session without a username/password flow and must avoid a connection method browsers don't support. Which two approaches satisfy that requirement?", note:"Chọn 2 đáp án",

 options:["Raise randomness settings so the model becomes less constrained by retrieved information","Retrieve authoritative information before answering so the response can be grounded in verifiable facts","Use tool selection rules and system instructions to influence how the model chooses tools","Avoid external retrieval because grounded responses are less accurate than training-only responses"],

];

/* =========================================================
   STATE & RENDER LOGIC
   ========================================================= */
let current = 0;
let answered = new Array(quizData.length).fill(null); // null | true | false (correct?)
let userSel = new Array(quizData.length).fill(null);

const quizArea = document.getElementById('quizArea');
const scoreLabel = document.getElementById('scoreLabel');
const progressFill = document.getElementById('progressFill');
const jumpGrid = document.getElementById('jumpGrid');

function buildJumpGrid(){
  jumpGrid.innerHTML = '';
  quizData.forEach((q,i)=>{
    const b = document.createElement('button');
    b.textContent = i+1;
    b.onclick = ()=>{ current = i; render(); closeSidebar(); };
    jumpGrid.appendChild(b);
  });
}

function updateHeader(){
  const answeredCount = answered.filter(a=>a!==null).length;
  const correctCount = answered.filter(a=>a===true).length;
  scoreLabel.textContent = correctCount + ' / ' + quizData.length + ' đúng (' + answeredCount + ' đã làm)';
  progressFill.style.width = (answeredCount/quizData.length*100) + '%';
  Array.from(jumpGrid.children).forEach((b,i)=>{
    b.classList.remove('done-ok','done-no','current');
    if(answered[i]===true) b.classList.add('done-ok');
    else if(answered[i]===false) b.classList.add('done-no');
    if(i===current) b.classList.add('current');
  });
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function formatExplain(text){
  // Xuống hàng giữa các câu/mệnh đề để dễ đọc: tách sau dấu chấm khi
  // theo sau là chữ hoa hoặc số (tránh tách nhầm viết tắt như "v.v." hay "e.g.").
  var parts = text.split(/(?<=\.)\s+(?=[A-Z0-9ÀÁẢÃẠĂẰẲẴẶẤẦẨẪẬÂÈÉẺẼẸÊỀẾỂỄỆÌÍỈĨỊÒÓỎÕỌÔỒỐỔỖỘƠỜỚỞỠỢÙÚỦŨỤƯỪỨỬỮỰỲÝỶỸỴĐ])/u);
  return parts.join('<br><br>');
}

function render(){
  const q = quizData[current];
  const isDone = answered[current] !== null;
  let html = '<div class="card">';
  html += '<div class="qnum">Câu ' + (current+1) + ' / ' + quizData.length + '</div>';
  html += '<div class="qtext">' + q.text + '</div>';
  if(q.note) html += '<div class="hint">' + q.note + '</div>';

  if(q.type === 'single' || q.type === 'multi'){
    html += '<div id="optList">';
    q.options.forEach((opt,i)=>{
      html += '<div class="option ' + (q.type==='multi'?'multi':'') + '" data-i="'+i+'" onclick="toggleOption('+i+')"><div class="mark"></div><div class="label">'+opt+'</div></div>';
    });
    html += '</div>';
  } else if(q.type === 'tf'){
    html += '<div id="tfList">';
    q.statements.forEach((s,i)=>{
      html += '<div class="statement" data-i="'+i+'"><div class="stext">'+s.text+'</div><div class="tfbtns">'+
        '<div class="tfbtn" data-val="true" onclick="setTF('+i+',true)">True / Đúng</div>'+
        '<div class="tfbtn" data-val="false" onclick="setTF('+i+',false)">False / Sai</div>'+
        '</div></div>';
    });
    html += '</div>';
  } else if(q.type === 'match'){
    html += '<div id="matchList">';
    q.rows.forEach((r,i)=>{
      html += '<div class="matchrow" data-i="'+i+'"><div class="desc">'+r.desc+'</div><select onchange="setMatch('+i+',this.value)"><option value="">-- chọn --</option>';
      q.pool.forEach(p=>{ html += '<option value="'+p+'">'+p+'</option>'; });
      html += '</select></div>';
    });
    html += '</div>';
  } else if(q.type === 'order'){
    if(!q._display) q._display = shuffle(q.correctOrder);
    html += '<div id="orderList">';
    q._display.forEach((text,i)=>{
      html += '<div class="orderitem" data-text="'+encodeURIComponent(text)+'"><select onchange="setOrder(this)"><option value="">#</option>';
      for(let n=1;n<=q.correctOrder.length;n++) html += '<option value="'+n+'">'+n+'</option>';
      html += '</select><div class="otext">'+text+'</div></div>';
    });
    html += '</div>';
  } else if(q.type === 'fill'){
    html += '<div id="fillList">';
    q.blanks.forEach((b,i)=>{
      html += '<div class="fillrow" data-i="'+i+'">'+ (b.prefix?b.prefix+' ':'') +
        '<select onchange="setFill('+i+',this.value)"><option value="">-- chọn --</option>';
      b.options.forEach(o=>{ html += '<option value="'+o+'">'+o+'</option>'; });
      html += '</select> ' + (b.suffix||'') + '</div>';
    });
    html += '</div>';
  }

  html += '<div class="explain" id="explainBox"><b>Giải thích:</b><br><br>' + formatExplain(q.explain) + '</div>';
  html += '<div class="actions">';
  html += '<button class="act btn-check" id="checkBtn" onclick="checkAnswer()">Kiểm tra</button>';
  html += '<button class="act btn-copy" onclick="copyPrompt()">📋 Copy prompt hỏi AI</button>';
  html += '</div>';
  html += '<div class="navrow"><button onclick="goPrev()" '+(current===0?'disabled':'')+'>&larr; Câu trước</button><button onclick="goNext()" '+(current===quizData.length-1?'disabled':'')+'>Câu sau &rarr;</button></div>';
  html += '</div>';

  quizArea.innerHTML = html;

  // restore state if already answered
  if(isDone){
    restoreState(q);
  }
  updateHeader();
}

function toggleOption(i){
  const q = quizData[current];
  if(answered[current] !== null) return;
  if(!userSel[current]) userSel[current] = q.type==='multi' ? new Set() : null;
  const els = document.querySelectorAll('#optList .option');
  if(q.type === 'single'){
    userSel[current] = i;
    els.forEach(e=>e.classList.remove('selected'));
    els[i].classList.add('selected');
  } else {
    if(userSel[current].has(i)) userSel[current].delete(i);
    else userSel[current].add(i);
    els[i].classList.toggle('selected');
  }
}

function setTF(i,val){
  if(answered[current] !== null) return;
  if(!userSel[current]) userSel[current] = {};
  userSel[current][i] = val;
  const stmt = document.querySelectorAll('#tfList .statement')[i];
  stmt.querySelectorAll('.tfbtn').forEach(b=>b.classList.remove('selected'));
  stmt.querySelector('.tfbtn[data-val="'+val+'"]').classList.add('selected');
}

function setMatch(i,val){
  if(!userSel[current]) userSel[current] = {};
  userSel[current][i] = val;
}

function setOrder(sel){
  if(!userSel[current]) userSel[current] = {};
  const item = sel.closest('.orderitem');
  const text = decodeURIComponent(item.getAttribute('data-text'));
  userSel[current][text] = sel.value;
}

function setFill(i,val){
  if(!userSel[current]) userSel[current] = {};
  userSel[current][i] = val;
}

function checkAnswer(){
  const q = quizData[current];
  if(answered[current] !== null) return;
  let isCorrect = false;

  if(q.type === 'single'){
    const sel = userSel[current];
    if(sel === null || sel === undefined){ alert('Hãy chọn một đáp án.'); return; }
    isCorrect = (sel === q.correct);
    const els = document.querySelectorAll('#optList .option');
    els.forEach((e,i)=>{
      if(i === q.correct) e.classList.add('correct');
      else if(i === sel) e.classList.add('incorrect');
    });
  } else if(q.type === 'multi'){
    const sel = userSel[current] || new Set();
    if(sel.size === 0){ alert('Hãy chọn các đáp án.'); return; }
    const correctSet = new Set(q.correct);
    isCorrect = sel.size === correctSet.size && [...sel].every(x=>correctSet.has(x));
    const els = document.querySelectorAll('#optList .option');
    els.forEach((e,i)=>{
      if(correctSet.has(i)) e.classList.add('correct');
      else if(sel.has(i)) e.classList.add('incorrect');
    });
  } else if(q.type === 'tf'){
    const sel = userSel[current] || {};
    if(Object.keys(sel).length < q.statements.length){ alert('Hãy chọn True/False cho tất cả.'); return; }
    isCorrect = true;
    const stmts = document.querySelectorAll('#tfList .statement');
    q.statements.forEach((s,i)=>{
      const userVal = sel[i];
      const ok = (userVal === s.answer);
      if(!ok) isCorrect = false;
      const btn = stmts[i].querySelector('.tfbtn[data-val="'+s.answer+'"]');
      btn.classList.add('correct');
      if(!ok){
        const wrongBtn = stmts[i].querySelector('.tfbtn[data-val="'+userVal+'"]');
        if(wrongBtn) wrongBtn.classList.add('incorrect');
      }
    });
  } else if(q.type === 'match'){
    const sel = userSel[current] || {};
    if(Object.keys(sel).length < q.rows.length){ alert('Hãy chọn cho tất cả các dòng.'); return; }
    isCorrect = true;
    const rows = document.querySelectorAll('#matchList .matchrow');
    q.rows.forEach((r,i)=>{
      const ok = sel[i] === r.correct;
      if(!ok) isCorrect = false;
      rows[i].classList.add(ok?'correct':'incorrect');
      const select = rows[i].querySelector('select');
      select.disabled = true;
      if(!ok){
        const hintSpan = document.createElement('div');
        hintSpan.style.fontSize='12px'; hintSpan.style.color='#1e8e3e'; hintSpan.style.marginTop='4px';
        hintSpan.textContent = 'Đáp án đúng: ' + r.correct;
        rows[i].appendChild(hintSpan);
      }
    });
  } else if(q.type === 'order'){
    const sel = userSel[current] || {};
    if(Object.keys(sel).length < q.correctOrder.length || Object.values(sel).some(v=>!v)){ alert('Hãy chọn số thứ tự cho tất cả.'); return; }
    isCorrect = true;
    const items = document.querySelectorAll('#orderList .orderitem');
    items.forEach(item=>{
      const text = decodeURIComponent(item.getAttribute('data-text'));
      const correctPos = q.correctOrder.indexOf(text) + 1;
      const userPos = parseInt(sel[text]);
      const ok = (userPos === correctPos);
      if(!ok) isCorrect = false;
      item.classList.add(ok?'correct':'incorrect');
      item.querySelector('select').disabled = true;
      if(!ok){
        const hintSpan = document.createElement('span');
        hintSpan.style.fontSize='12px'; hintSpan.style.color='#1e8e3e'; hintSpan.style.marginLeft='8px';
        hintSpan.textContent = '(đúng: #' + correctPos + ')';
        item.appendChild(hintSpan);
      }
    });
  } else if(q.type === 'fill'){
    const sel = userSel[current] || {};
    if(Object.keys(sel).length < q.blanks.length || Object.values(sel).some(v=>!v)){ alert('Hãy chọn cho tất cả các ô trống.'); return; }
    isCorrect = true;
    const rows = document.querySelectorAll('#fillList .fillrow');
    q.blanks.forEach((b,i)=>{
      const ok = sel[i] === b.correct;
      if(!ok) isCorrect = false;
      rows[i].classList.add(ok?'correct':'incorrect');
      rows[i].querySelector('select').disabled = true;
      if(!ok){
        const hintSpan = document.createElement('span');
        hintSpan.style.fontSize='12px'; hintSpan.style.color='#1e8e3e'; hintSpan.style.marginLeft='6px';
        hintSpan.textContent = '(đúng: ' + b.correct + ')';
        rows[i].appendChild(hintSpan);
      }
    });
  }

  answered[current] = isCorrect;
  document.getElementById('checkBtn').disabled = true;
  document.getElementById('explainBox').classList.add('show');
  const badge = document.createElement('div');
  badge.className = 'result-badge ' + (isCorrect?'ok':'no');
  badge.textContent = isCorrect ? '✔ Chính xác' : '✘ Chưa đúng';
  document.getElementById('explainBox').prepend(badge);

  updateHeader();
}

function restoreState(q){
  // disable inputs and re-apply visual state after navigating back to an answered question
  const sel = userSel[current];
  if(q.type === 'single' || q.type === 'multi'){
    const els = document.querySelectorAll('#optList .option');
    const correctSet = new Set(Array.isArray(q.correct)?q.correct:[q.correct]);
    els.forEach((e,i)=>{
      e.onclick = null;
      const userHas = q.type==='multi' ? (sel && sel.has && sel.has(i)) : (sel===i);
      if(correctSet.has(i)) e.classList.add('correct');
      else if(userHas) e.classList.add('incorrect');
    });
  } else if(q.type === 'tf'){
    const stmts = document.querySelectorAll('#tfList .statement');
    q.statements.forEach((s,i)=>{
      stmts[i].querySelectorAll('.tfbtn').forEach(b=>b.onclick=null);
      const btn = stmts[i].querySelector('.tfbtn[data-val="'+s.answer+'"]');
      btn.classList.add('correct');
      const userVal = sel ? sel[i] : undefined;
      if(userVal !== undefined && userVal !== s.answer){
        const wrongBtn = stmts[i].querySelector('.tfbtn[data-val="'+userVal+'"]');
        if(wrongBtn) wrongBtn.classList.add('incorrect');
      }
    });
  } else if(q.type === 'match'){
    const rows = document.querySelectorAll('#matchList .matchrow');
    q.rows.forEach((r,i)=>{
      const select = rows[i].querySelector('select');
      select.disabled = true;
      if(sel && sel[i]) select.value = sel[i];
      const ok = sel && sel[i] === r.correct;
      rows[i].classList.add(ok?'correct':'incorrect');
      if(!ok){
        const hintSpan = document.createElement('div');
        hintSpan.style.fontSize='12px'; hintSpan.style.color='#1e8e3e'; hintSpan.style.marginTop='4px';
        hintSpan.textContent = 'Đáp án đúng: ' + r.correct;
        rows[i].appendChild(hintSpan);
      }
    });
  } else if(q.type === 'order'){
    const items = document.querySelectorAll('#orderList .orderitem');
    items.forEach(item=>{
      const text = decodeURIComponent(item.getAttribute('data-text'));
      const select = item.querySelector('select');
      select.disabled = true;
      if(sel && sel[text]) select.value = sel[text];
      const correctPos = q.correctOrder.indexOf(text) + 1;
      const userPos = sel ? parseInt(sel[text]) : null;
      const ok = (userPos === correctPos);
      item.classList.add(ok?'correct':'incorrect');
      if(!ok){
        const hintSpan = document.createElement('span');
        hintSpan.style.fontSize='12px'; hintSpan.style.color='#1e8e3e'; hintSpan.style.marginLeft='8px';
        hintSpan.textContent = '(đúng: #' + correctPos + ')';
        item.appendChild(hintSpan);
      }
    });
  } else if(q.type === 'fill'){
    const rows = document.querySelectorAll('#fillList .fillrow');
    q.blanks.forEach((b,i)=>{
      const select = rows[i].querySelector('select');
      select.disabled = true;
      if(sel && sel[i]) select.value = sel[i];
      const ok = sel && sel[i] === b.correct;
      rows[i].classList.add(ok?'correct':'incorrect');
      if(!ok){
        const hintSpan = document.createElement('span');
        hintSpan.style.fontSize='12px'; hintSpan.style.color='#1e8e3e'; hintSpan.style.marginLeft='6px';
        hintSpan.textContent = '(đúng: ' + b.correct + ')';
        rows[i].appendChild(hintSpan);
      }
    });
  }
  document.getElementById('checkBtn').disabled = true;
  document.getElementById('explainBox').classList.add('show');
  const badge = document.createElement('div');
  badge.className = 'result-badge ' + (answered[current]?'ok':'no');
  badge.textContent = answered[current] ? '✔ Chính xác' : '✘ Chưa đúng';
  document.getElementById('explainBox').prepend(badge);
}

function buildPromptText(q){
  let body = 'Tôi đang ôn thi chứng chỉ Microsoft AI-103 (Azure AI Engineer). ';
  body += 'Hãy giải thích chi tiết, dễ hiểu bằng tiếng Việt cho câu hỏi trắc nghiệm sau, kèm ví dụ thực tế nếu có thể.\n\n';
  body += '--- CÂU HỎI ---\n' + q.text + '\n\n';

  if(q.type === 'single' || q.type === 'multi'){
    body += (q.type==='multi' ? '(Chọn nhiều đáp án)\n' : '(Chọn một đáp án)\n');
    q.options.forEach((opt,i)=>{
      body += String.fromCharCode(65+i) + '. ' + opt + '\n';
    });
    body += '\n--- ĐÁP ÁN ĐÚNG THEO HỆ THỐNG ---\n';
    const correctArr = Array.isArray(q.correct) ? q.correct : [q.correct];
    body += correctArr.map(i=>String.fromCharCode(65+i)).join(', ') + '\n';
  } else if(q.type === 'tf'){
    body += 'Với mỗi phát biểu, cho biết True hay False:\n';
    q.statements.forEach((s,i)=>{
      body += (i+1) + '. ' + s.text + ' → Đáp án đúng: ' + (s.answer?'True':'False') + '\n';
    });
  } else if(q.type === 'match'){
    body += 'Ghép mỗi mô tả với khái niệm đúng:\n';
    q.rows.forEach((r,i)=>{
      body += (i+1) + '. ' + r.desc + ' → Đáp án đúng: ' + r.correct + '\n';
    });
  } else if(q.type === 'order'){
    body += 'Sắp xếp các bước theo thứ tự đúng. Thứ tự đúng là:\n';
    q.correctOrder.forEach((s,i)=>{
      body += (i+1) + '. ' + s + '\n';
    });
  } else if(q.type === 'fill'){
    body += 'Điền vào chỗ trống. Đáp án đúng cho từng ô:\n';
    q.blanks.forEach((b,i)=>{
      body += (i+1) + '. ' + (b.prefix||'') + ' ___ ' + (b.suffix||'') + ' → Đáp án đúng: ' + b.correct + '\n';
    });
  }

  body += '\n--- GIẢI THÍCH NGẮN HIỆN CÓ ---\n' + q.explain.replace(/<[^>]+>/g,'') + '\n\n';
  body += 'Hãy giải thích sâu hơn: vì sao đáp án đúng là đúng, vì sao các đáp án còn lại sai/không phù hợp, ';
  body += 'và nếu có khái niệm liên quan trong Azure AI mà tôi cần nắm để không nhầm lẫn trong các câu tương tự, hãy nói rõ luôn.';
  return body;
}

function copyPrompt(){
  const q = quizData[current];
  const text = buildPromptText(q);
  const doToast = ()=>{
    const toast = document.getElementById('copyToast');
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'), 1800);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(doToast).catch(()=>fallbackCopy(text, doToast));
  } else {
    fallbackCopy(text, doToast);
  }
}

function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(cb) cb();
}

function goPrev(){ if(current>0){ current--; render(); } }
function goNext(){ if(current<quizData.length-1){ current++; render(); } }

function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

buildJumpGrid();
render();
