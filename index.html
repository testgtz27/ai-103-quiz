<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ôn tập AI-103</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="index-wrap">
  <div class="index-header">
    <h1>📚 Ôn tập AI-103</h1>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Đổi giao diện sáng/tối">🌙</button>
  </div>
  <div class="index-sub">Chọn một bộ quiz để bắt đầu luyện tập</div>
  <div id="list"></div>

  <div class="history-section">
    <div class="history-header">
      <h2>🕓 Lịch sử làm bài</h2>
      <button class="history-clear" onclick="clearHistory()">Xoá lịch sử</button>
    </div>
    <div id="historyList"></div>
  </div>
</div>

<script src="theme.js"></script>
<script>
/* =========================================================
   Danh sách quiz — thêm quiz mới ở đây, mỗi lần chỉ cần
   thêm 1 object vào array bên dưới rồi upload file lên repo.
   ========================================================= */
const quizzes = [
  {
    file: "ai-103-quiz-1.html",
    tag: "AI-103",
    title: "Quiz 1 — 60 câu",
    desc: "Tổng hợp câu hỏi luyện tập AI-103 (single/multi choice, true-false, matching, sắp xếp, điền chỗ trống)."
  },
  {
    file: "ai-103-quiz-2.html",
    tag: "AI-103",
    title: "Quiz 2 — 30 câu",
    desc: "Câu hỏi biên soạn theo các chủ đề/tình huống thường gặp trong đề thi AI-103: agent, RAG, orchestration, Content Understanding, responsible AI..."
  },
  {
    file: "ai-103-quiz-3.html",
    tag: "AI-103",
    title: "Quiz 3 — 60 câu",
    desc: "Foundry SDK/Portal/IQ, model catalog, agent orchestration (sequential/group chat/Magentic/A2A), MCP tools, speech, language, Content Understanding."
  },
  {
    file: "ai-103-quiz-4.html",
    tag: "AI-103",
    title: "Quiz 4 — 60 câu",
    desc: "Responses API, benchmark metrics, orchestration patterns (concurrent/handoff/Magentic), MCP dynamic discovery, Voice Live, Document Intelligence."
  },
  {
    file: "ai-103-quiz-5.html",
    tag: "AI-103",
    title: "Quiz 5 — 60 câu",
    desc: "Responsible AI, model catalog filters, evaluation, code interpreter, agent frameworks, Voice Live auth, Document Intelligence, search enrichment."
  },
  {
    file: "ai-103-quiz-6.html",
    tag: "AI-103",
    title: "Quiz 6 — 50 câu",
    desc: "Câu hỏi tình huống thực tế: Content Understanding analyzer, prompt shields/spotlighting, agent memory & thread, RAG observability, image editing, CI/CD evaluation gate."
  },
  {
    file: "ai-103-quiz-7.html",
    tag: "AI-103",
    title: "Quiz 7 — 50 câu",
    desc: "Foundry deployment & RBAC, MCP tool_choice, Content Safety, Power Fx, agentic RAG — cộng thêm Computer Vision, Text Analysis, Information Extraction, Search."
  }
  // Thêm quiz mới ở đây, ví dụ:
  // {
  //   file: "ai-103-quiz-7.html",
  //   tag: "AI-103",
  //   title: "Quiz 7 — 60 câu",
  //   desc: "Mô tả ngắn cho quiz này."
  // },
];

/* =========================================================
   Đọc tiến trình & lịch sử làm bài từ localStorage.
   Dữ liệu được quiz-engine.js ghi lại mỗi khi làm bài, dùng
   chung key nên vẫn còn nguyên dù bạn deploy code mới lên.
   ========================================================= */
function loadProgressFor(file){
  try{
    const raw = localStorage.getItem('ai103_progress_' + file);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function loadHistory(){
  try{
    const raw = localStorage.getItem('ai103_history');
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}

function formatDateTime(ts){
  const d = new Date(ts);
  return d.toLocaleString('vi-VN', {
    day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'
  });
}

function scoreClass(correct, total){
  if(total === 0) return 'mid';
  const pct = correct / total;
  if(pct >= 0.8) return 'good';
  if(pct >= 0.5) return 'mid';
  return 'low';
}

function clearHistory(){
  if(!confirm('Xoá toàn bộ lịch sử làm bài? Hành động này không thể hoàn tác.')) return;
  try{ localStorage.removeItem('ai103_history'); }catch(e){}
  renderHistory();
}

function renderHistory(){
  const el = document.getElementById('historyList');
  const history = loadHistory().slice().reverse(); // mới nhất lên đầu
  if(history.length === 0){
    el.innerHTML = '<div class="index-empty">Chưa có lượt làm bài nào được ghi lại. Hoàn thành 1 quiz để thấy lịch sử ở đây.</div>';
    return;
  }
  el.innerHTML = history.map(h => `
    <div class="history-item">
      <div class="h-left">
        <div class="h-title">${h.quizTitle || h.quizFile}</div>
        <div class="h-date">${formatDateTime(h.date)}</div>
      </div>
      <div class="h-score ${scoreClass(h.correct, h.total)}">${h.correct} / ${h.total}</div>
    </div>
  `).join('');
}

const listEl = document.getElementById('list');
if(quizzes.length === 0){
  listEl.innerHTML = '<div class="index-empty">Chưa có quiz nào. Thêm file .html và khai báo trong index.html.</div>';
} else {
  listEl.innerHTML = quizzes.map(q => {
    const p = loadProgressFor(q.file);
    let badge = '';
    if(p && p.total > 0){
      if(p.answeredCount >= p.total){
        badge = `<div class="progress-badge done">✅ Đã hoàn thành: ${p.correct}/${p.total} đúng</div>`;
      } else if(p.answeredCount > 0){
        badge = `<div class="progress-badge ongoing">🕒 Đang làm dở: ${p.answeredCount}/${p.total} câu</div>`;
      }
    }
    return `
    <a class="quiz-card" href="${q.file}">
      <div class="tag">${q.tag}</div>
      <div class="title">${q.title}</div>
      <div class="desc">${q.desc}</div>
      ${badge}
    </a>
  `;
  }).join('');
}

renderHistory();
</script>
</body>
</html>
