<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AI-103 Quiz 4 (60 câu)</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="top">
    <a class="logo-link" href="index.html" title="Về trang chủ">
      <span class="home-icon">🏠</span>
      <h1>AI-103 · Quiz 4</h1>
    </a>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="score" id="scoreLabel">0 / 60 đúng</div>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Đổi giao diện sáng/tối">🌙</button>
      <button class="hamburger" onclick="openSidebar()" aria-label="Danh sách câu hỏi"><span></span></button>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</header>

<div class="wrap">
  <div id="quizArea"></div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>Danh sách câu hỏi</h2>
    <button class="sidebar-close" onclick="closeSidebar()">&times;</button>
  </div>
  <div class="sidebar-legend">
    <span><span class="legend-dot ok"></span>Đúng</span>
    <span><span class="legend-dot no"></span>Sai</span>
    <span><span class="legend-dot none"></span>Chưa làm</span>
  </div>
  <div class="jumpgrid" id="jumpGrid"></div>
  <a class="sidebar-home-link" href="index.html">🏠 Về trang chủ</a>
</div>

<div class="copy-toast" id="copyToast">Đã copy prompt vào clipboard ✓</div>

<script src="data/quiz-4-data.js"></script>
<script src="theme.js"></script>
<script src="quiz-engine.js"></script>
</body>
</html>
